name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Důležité pro historii commitů

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
# 1. UPDATE README V REPOZITÁŘI (Oprava detached HEAD)
      - name: Update README Version in Repo
        shell: powershell
        run: |
          # Nastavení Gitu
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # DŮLEŽITÉ: Přepnutí z Tagu na větev Main
          Write-Host "Switching to main branch..."
          git fetch origin main
          git checkout main
          git pull origin main --rebase
          
          # Nyní jsme na main, můžeme upravovat
          $version = "${{ github.ref_name }}"
          Write-Host "Updating README to version: $version"
          
          $content = Get-Content "README.md" -Raw -Encoding UTF8
          $newContent = $content -replace '\{\{VERSION\}\}', $version
          Set-Content -Path "README.md" -Value $newContent -Encoding UTF8
          
          # Commit a Push
          try {
            git add README.md
            git commit -m "chore: update readme version to $version [skip ci]"
            # Teď už můžeme pushnout normálně, protože jsme na main
            git push origin main
            Write-Host "Success: README updated."
          } catch {
            Write-Host "Nothing to commit or push failed (maybe version already set)."
          }

      - name: Install dependencies
        run: npm install --production

# 2. GENERATE AI NOTES (Oprava syntaxe pro PowerShell)
      - name: Create Release Notes Script
        shell: powershell
        run: |
          $scriptContent = @"
          import { execSync } from 'child_process';
          import fs from 'fs';

          const GEMINI_MODEL = 'gemini-3-pro-preview';
          const OUTPUT_FILE = 'release_body.md';

          console.log('--- STARTING LOG ANALYSIS ---');

          let commits = '';
          let diff = '';

          try {
            const prevTag = execSync('git describe --tags --abbrev=0 HEAD^', { encoding: 'utf8' }).trim();
            console.log('Previous tag: ' + prevTag);
            const range = prevTag + '..HEAD';
            commits = execSync('git log ' + range + ' --pretty=format:"- %s (%an)"', { encoding: 'utf8' }).toString();
            diff = execSync('git diff ' + range + ' --stat -- ":!package-lock.json" ":!node_modules/*"', { encoding: 'utf8' }).toString();
          } catch (e) {
            console.log('Could not determine tag range, using fallback.');
            try {
                commits = execSync('git log -n 15 --pretty=format:"- %s (%an)"', { encoding: 'utf8' }).toString();
            } catch (err) { commits = 'No git history available.'; }
          }

          const tagName = process.env.TAG_NAME || 'Unknown Version';
          
          // ZDE BYLA CHYBA: Nahrazeno klasickými uvozovkami a plusy (+)
          const prompt = "You are a Release Manager. Write release notes for " + tagName + ".\n\n" +
          "COMMITS HISTORY:\n" + commits + "\n\n" +
          "DIFF STATS:\n" + diff + "\n\n" +
          "INSTRUCTIONS:\n" +
          "1. Start with headline: # Release Notes - " + tagName + "\n" +
          "2. Categorize changes into:\n" +
          "   ## 🚀 New Features\n" +
          "   ## 🐞 Bug Fixes\n" +
          "   ## 🔧 Improvements\n" +
          "3. Use standard Unicode Emojis.\n" +
          "4. Be concise. Summarize technical changes clearly.\n" +
          "5. Output ONLY the Markdown.";

          async function run() {
            if (!process.env.GEMINI_API_KEY) { 
              fs.writeFileSync(OUTPUT_FILE, '## Manual Check Required', 'utf8'); 
              return; 
            }

            const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + process.env.GEMINI_API_KEY;
            
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              });

              const data = await response.json();
              if (data.candidates && data.candidates[0].content) {
                const text = data.candidates[0].content.parts[0].text;
                fs.writeFileSync(OUTPUT_FILE, text, 'utf8');
                console.log('Notes generated successfully.');
              } else {
                console.log('AI Response empty:', JSON.stringify(data));
                fs.writeFileSync(OUTPUT_FILE, '## AI Generation Failed', 'utf8');
              }
            } catch (e) {
              console.error(e);
              fs.writeFileSync(OUTPUT_FILE, '## AI Error: ' + e.message, 'utf8');
            }
          }

          run();
          "@
          
          $scriptContent | Out-File -FilePath "release-notes.js" -Encoding utf8

      - name: Generate AI Notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG_NAME: ${{ github.ref_name }}
        run: node release-notes.js

      - name: Append Footer
        shell: powershell
        run: |
          $footer = @"
          
          ---
          *Released by @VlastikYoutubeKo*

          ### 📦 Installation
          1. Install Node.js (v20+)
          2. Download and Extract ZIP
          3. Run `START.bat`
          "@
          # Append s encodingem UTF8
          Add-Content -Path release_body.md -Value $footer -Encoding UTF8

      # 3. BALÍČKOVÁNÍ (Už nemusí měnit README, to jsme udělali v kroku 1)
      - name: Package Source Code
        shell: powershell
        run: |
          $releaseDir = "release\LFS-LiveMap-Radio"
          New-Item -ItemType Directory -Force -Path $releaseDir
          
          $filesToCopy = @(
            "public",
            "node_modules",
            "server.js",
            "radio_browser.js",
            "abradia_api.js",
            "track_names.js",
            "gps_logger.js",
            "tc_locations.js",
            "local_music_addon.js",
            "package.json",
            "START.bat",
            "README.md" 
          )
          # README.md se zkopíruje už upravené z rootu (díky kroku 1)

          foreach ($item in $filesToCopy) {
            if (Test-Path $item) {
              Copy-Item -Path $item -Destination $releaseDir -Recurse -Force
            }
          }
          
          # Config handling
          if (-not (Test-Path "$releaseDir\radio_config.json")) {
              if (Test-Path "radio_config.example.json") {
                  Copy-Item "radio_config.example.json" -Destination "$releaseDir\radio_config.json"
              } elseif (Test-Path "radio_config.json") {
                   Copy-Item "radio_config.json" -Destination "$releaseDir\radio_config.json"
              }
          }

      - name: Create release archive
        run: |
          cd release
          Compress-Archive -Path LFS-LiveMap-Radio -DestinationPath LFS-LiveMap-Radio-${{ github.ref_name }}.zip
        shell: powershell
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/LFS-LiveMap-Radio-${{ github.ref_name }}.zip
          generate_release_notes: false 
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}