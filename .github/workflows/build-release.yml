name: Build Release

on:
  push:
    tags:
      - 'v*'  # Spustí se při push tagu typu v1.0.0
  workflow_dispatch:  # Umožní manuální spuštění

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Důležité pro získání historie commitů

      - name: Setup Node.js 21+
        uses: actions/setup-node@v4
        with:
          node-version: '21'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build executable with SEA
        run: npm run build
      
      # --- AI GENERATION STEP START (GEMINI) ---
      - name: Generate AI Release Notes
        id: ai_notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG_NAME: ${{ github.ref_name }}
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            
            // 1. Zjistit předchozí tag pro porovnání
            let prevTag = '';
            try {
              prevTag = execSync('git describe --tags --abbrev=0 HEAD^').toString().trim();
              console.log(`Previous tag detected: ${prevTag}`);
            } catch (e) {
              console.log("No previous tag found, assuming first release.");
            }

            const range = prevTag ? `${prevTag}..HEAD` : 'HEAD';
            
            // 2. Získat Commits a Diff
            const commits = execSync(`git log ${range} --pretty=format:"- %s (%an)"`).toString();
            
            // Získáme diff, ale ignorujeme velké soubory, lock files a binárky
            const diff = execSync(`git diff ${range} --stat -- ":!package-lock.json" ":!dist/*" ":!node_modules/*" ":!*.png" ":!*.exe"`).toString();

            // 3. Prompt pro AI
            const prompt = `
            You are a Release Manager for a software called "LFS Live Map + Radio".
            Create a structured release note for version ${process.env.TAG_NAME}.
            
            Here are the changes since the last version:
            
            COMMITS:
            ${commits}
            
            CHANGED FILES STATS:
            ${diff}
            
            Instructions:
            1. Start with a header including the version.
            2. Summarize the changes based on the commits and files touched.
            3. Group changes into sections: 🚀 New Features, 🐛 Bug Fixes, 🛠️ Improvements (if applicable).
            4. If the code suggests changes to the API (TC API logic) or server logic (chase logic), mention it specifically.
            5. Use Markdown format.

            Also, include links to issues. They are at github.com/vlastikyoutubeko/lfs-lmar/issues.
            
            `;

            // 4. Volání Google Gemini API (REST)
            if (!process.env.GEMINI_API_KEY) {
                console.log("No GEMINI_API_KEY found. Skipping AI summary.");
                return "## ⚠️ AI Summary Unavailable\nCheck commits manually.";
            }

            // Používáme gemini-1.5-flash, je rychlý a efektivní pro tento účel.
            // Pokud chceš jiný model, změň URL (např. gemini-1.5-pro).
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${process.env.GEMINI_API_KEY}`;

            const requestBody = {
              contents: [{
                parts: [{ text: prompt }]
              }]
            };

            try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error(`Gemini API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                // Parsování odpovědi z Gemini
                if (data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts.length > 0) {
                    const aiSummary = data.candidates[0].content.parts[0].text;
                    core.setOutput('summary', aiSummary);
                } else {
                    console.error("Unexpected Gemini response structure:", JSON.stringify(data));
                    core.setOutput('summary', "## ⚠️ AI Generation Failed (Empty response)");
                }

            } catch (error) {
                console.error("Error calling Gemini API:", error);
                core.setOutput('summary', "## ⚠️ AI Generation Error\nSee build logs for details.");
            }

      # --- AI GENERATION STEP END ---

      - name: Verify executable
        run: |
          if (Test-Path "dist\lfs-live-map-radio.exe") {
            Write-Host "Executable created successfully"
            $size = (Get-Item "dist\lfs-live-map-radio.exe").Length / 1MB
            Write-Host "Size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Executable not found"
            exit 1
          }
        shell: powershell
      
      - name: Create release archive
        run: |
          mkdir release
          xcopy /E /I /Y dist release\LFS-LiveMap-Radio
          cd release
          Compress-Archive -Path LFS-LiveMap-Radio -DestinationPath LFS-LiveMap-Radio-${{ github.ref_name }}.zip
        shell: powershell
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/LFS-LiveMap-Radio-${{ github.ref_name }}.zip
          generate_release_notes: false 
          body: |
            ${{ steps.ai_notes.outputs.summary }}
            
            ---
            
            ### 📦 Installation:
            1. Download and extract ZIP
            2. Run `lfs-live-map-radio.exe`
            3. In LFS: `/insim 29999`
            4. Open browser: `http://localhost:3000`
            
            ### 📋 Requirements:
            - Windows 10/11 x64
            - MPV or VLC (for radio playback)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}