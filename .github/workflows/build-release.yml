name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 21+
        uses: actions/setup-node@v4
        with:
          node-version: '21'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build executable with SEA
        run: npm run build
      
      # --- KROK 1: VYTVOŘENÍ JS SOUBORU S NOVÝM PROMPTEM ---
      - name: Create Release Notes Script
        shell: powershell
        run: |
          $scriptContent = @"
          import { execSync } from 'child_process';
          import fs from 'fs';

          const GEMINI_MODEL = 'gemini-3-flash-preview'; // Doporučuji novější model, je rychlejší/levnější, nebo nech 'gemini-1.5-flash'

          console.log('--- STARTING HISTORY ---');

          try { execSync('git fetch --tags --force'); } catch (e) {}

          let commits = '';
          let diff = '';

          try {
            const prevTag = execSync('git describe --tags --abbrev=0 HEAD^').toString().trim();
            console.log('Prev Tag found: ' + prevTag);
            const range = prevTag + '..HEAD';
            commits = execSync('git log ' + range + ' --pretty=format:"- %s (%an)"').toString();
            diff = execSync('git diff ' + range + ' --stat -- ":!package-lock.json" ":!dist/*" ":!node_modules/*" ":!*.png" ":!*.exe"').toString();
          } catch (e) {
            console.log('Standard tag fetch failed.');
          }

          if (!commits || commits.trim().length === 0) {
            console.log('Using fallback history.');
            try {
                commits = execSync('git log -n 5 --pretty=format:"- %s (%an)"').toString();
            } catch (e) { commits = 'No commits available.'; }
            diff = 'Full diff stats unavailable in fallback mode.';
          }

          const tagName = process.env.TAG_NAME || 'Unknown Version';
          
          // --- ZDE JE UPRAVENÝ PROMPT PRO POŽADOVANÝ STYL ---
          const prompt = 'You are a Release Manager. Write release notes for ' + tagName + ' based on the commits below.\\n\\n' +
            'COMMITS:\\n' + commits + '\\n\\n' +
            'STATS:\\n' + diff + '\\n\\n' +
            'STRICT OUTPUT FORMAT RULES:\\n' +
            '1. Start with title: # Release Notes - ' + tagName + '\\n' +
            '2. Section 1: ## 🚀 Improvements\\n' +
            '3. Section 2: ## 🐞 Bug Fixes\\n' +
            '4. Section 3: ## 🔧 Technical Notes\\n' +
            '5. Formatting: Use bullet points. Start each bullet with a bold category name followed by a colon (e.g., * **Radio UI:** Fixed issue...).\\n' +
            '6. CONTENT RULES: Group commits logically. If you see "TC API" or "Chase logic", explicitly mention them in Technical Notes. Keep summaries professional and concise.\\n' +
            '7. Do NOT include any intro text, footer, or signature. Just the markdown content.';

          async function run() {
            if (!process.env.GEMINI_API_KEY) {
              console.log('No API Key.');
              fs.writeFileSync('release_body.md', '## Manual Check Required');
              return;
            }

            // Použijeme gemini-1.5-flash nebo gemini-2.0-flash-exp, pokud je v const nahoře nastaven
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + process.env.GEMINI_API_KEY;
            
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              });

              if (!response.ok) throw new Error('API Error: ' + response.status);

              const data = await response.json();
              if (data.candidates && data.candidates[0].content) {
                fs.writeFileSync('release_body.md', data.candidates[0].content.parts[0].text);
              } else {
                fs.writeFileSync('release_body.md', '## AI Generation Failed');
              }
            } catch (e) {
              console.error(e);
              fs.writeFileSync('release_body.md', '## AI Error: ' + e.message);
            }
          }

          run();
          "@
          
          Set-Content -Path "release-notes.js" -Value $scriptContent -Encoding UTF8

      # --- KROK 2: SPUŠTĚNÍ SKRIPTU ---
      - name: Generate AI Notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG_NAME: ${{ github.ref_name }}
        run: node release-notes.js

      # --- KROK 3: PŘIPRAVIT FINÁLNÍ TEXT (AI + PATA DLE POŽADAVKU) ---
      - name: Prepare Release Body
        shell: powershell
        run: |
          # Zde je patička přesně podle tvého vzoru
          $footer = @"
          
          ---
          For a full list of issues and tasks, please visit our [Issue Tracker](https://github.com/vlastikyoutubeko/lfs-lmar/issues).

          *Released by @VlastikYoutubeKo*

          ### 📦 Installation
          1. Download ZIP
          2. Run `lfs-live-map-radio.exe`
          3. In LFS: `/insim 29999`
          4. Open browser: `http://localhost:3000`
          "@
          
          # Připojíme patičku k AI textu
          Add-Content -Path release_body.md -Value $footer

      - name: Verify executable
        run: |
          if (Test-Path "dist\lfs-live-map-radio.exe") {
            Write-Host "Executable OK"
          } else {
            exit 1
          }
        shell: powershell
      
      - name: Create release archive
        run: |
          mkdir release
          xcopy /E /I /Y dist release\LFS-LiveMap-Radio
          cd release
          Compress-Archive -Path LFS-LiveMap-Radio -DestinationPath LFS-LiveMap-Radio-${{ github.ref_name }}.zip
        shell: powershell
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/LFS-LiveMap-Radio-${{ github.ref_name }}.zip
          generate_release_notes: false 
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}