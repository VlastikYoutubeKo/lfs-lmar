name: Build Release

on:
  push:
    tags:
      - 'v*'  # Spustí se při push tagu typu v1.0.0
  workflow_dispatch:  # Umožní manuální spuštění

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install pkg globally
        run: npm install -g pkg
      
      - name: Build executable
        run: npm run build
      
      - name: Create release archive
        run: |
          mkdir release
          xcopy /E /I /Y dist release\LFS-LiveMap-Radio
          cd release
          Compress-Archive -Path LFS-LiveMap-Radio -DestinationPath LFS-LiveMap-Radio-${{ github.ref_name }}.zip
        shell: powershell
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LFS-LiveMap-Radio-${{ github.ref_name }}
          path: release/LFS-LiveMap-Radio-${{ github.ref_name }}.zip
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/LFS-LiveMap-Radio-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
