<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LFS Maps Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      /* Mobile optimizations */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overscroll-behavior: none; /* Prevent pull-to-refresh */
    }
    
    #map { 
      position: fixed; 
      inset: 0; 
      background: #1a1a1a;
    }
    
    canvas { 
      display: block; 
      width: 100%; 
      height: 100%;
      touch-action: none; /* Disable browser touch gestures */
    }
    
    /* ===== NAVIGATION BAR ===== */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      z-index: 1000;
    }
    
    #navbar h1 {
      font-size: 20px;
      font-weight: 600;
      color: #4a9eff;
    }
    
    #searchBox {
      flex: 1;
      max-width: 500px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 0 20px;
      color: #fff;
      font-size: 16px; /* 16px prevents iOS auto-zoom */
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none; /* Remove iOS default styling */
      -webkit-user-select: text; /* Allow text selection in input */
      user-select: text;
    }
    
    #searchBox:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: #4a9eff;
    }
    
    #searchResults {
      position: absolute;
      top: 65px;
      left: 20px;
      width: 500px;
      max-height: 400px;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow-y: auto;
      display: none;
    }
    
    #searchResults.show { display: block; }
    
    .result-group {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .result-group:last-child { border: none; }
    
    .result-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .result-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    
    .result-item:hover {
      background: rgba(74, 158, 255, 0.15);
    }
    
    .result-icon {
      font-size: 20px;
      width: 30px;
      text-align: center;
    }
    
    .result-name {
      flex: 1;
      font-size: 14px;
    }
    
    /* ===== HUD (NAVIGATION) ===== */
    #hud {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 24px;
      display: none;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      min-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    
    #hud.active { display: flex; }
    
    #turnIcon {
      font-size: 48px;
      width: 60px;
      text-align: center;
    }
    
    #hudInfo {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    #timeRow {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    
    #timeEta {
      font-size: 32px;
      font-weight: 700;
      color: #4a9eff;
    }
    
    #distance {
      font-size: 18px;
      color: #888;
    }
    
    #metaRow {
      display: flex;
      gap: 12px;
      font-size: 14px;
      color: #aaa;
    }
    
    #arrival { font-weight: 600; }
    
    #targetName {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    #closeNav {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    
    #closeNav:hover {
      background: rgba(255, 70, 70, 0.2);
      color: #ff4646;
    }
    
    /* ===== CONTROLS ===== */
    #controls {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }
    
    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    
    .control-btn:hover {
      background: rgba(74, 158, 255, 0.2);
      border-color: #4a9eff;
      transform: scale(1.1);
    }
    
    .control-btn.active {
      background: #4a9eff;
      color: #000;
    }
    
    /* ===== PLAYER LIST ===== */
    #playerList {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 250px;
      max-height: 400px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: none;
    }
    
    #playerList.show { display: block; }
    
    #playerCount {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .player-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    
    .player-item:hover {
      background: rgba(74, 158, 255, 0.15);
    }
    
    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(74, 158, 255, 0.95);
      color: #000;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 2000;
    }
    
    #loader.show { display: block; }
  </style>
</head>
<body>
  <!-- MAP -->
  <div id="map">
    <canvas id="canvas"></canvas>
  </div>
  
  <!-- NAVBAR -->
  <div id="navbar">
    <h1>🏁 LFS Maps</h1>
    <input type="text" id="searchBox" placeholder="Hledat místa nebo hráče..." />
    <div style="flex: 1;"></div>
    <div id="onlineCount" style="font-size: 13px; color: #888;">0 online</div>
  </div>
  
  <!-- SEARCH RESULTS -->
  <div id="searchResults"></div>
  
  <!-- HUD (Navigation) -->
  <div id="hud">
    <div id="turnIcon">⬆️</div>
    <div id="hudInfo">
      <div id="timeRow">
        <div id="timeEta">-- min</div>
        <div id="distance">-- km</div>
      </div>

  <div id="controls">
    <button class="control-btn" id="zoomInBtn">+</button>

  </div>
  
  <!-- PLAYER LIST -->
  <div id="playerList">
    <div id="playerCount">0 HRÁČŮ</div>
    <div id="playerItems"></div>
  </div>
  
  <!-- LOADER -->
  <div id="loader">Načítám navigační graf...</div>

  <!-- WORKER CODE -->
  <script id="worker-code" type="javascript/worker">
    class PriorityQueue {
      constructor() { this.items = []; }
      enqueue(element, priority) {
        const qElement = { element, priority };
        let added = false;
        for (let i = 0; i < this.items.length; i++) {
          if (this.items[i].priority > qElement.priority) {
            this.items.splice(i, 0, qElement);
            added = true;
            break;
          }
        }
        if (!added) this.items.push(qElement);
      }
      dequeue() { return this.items.shift(); }
      isEmpty() { return this.items.length === 0; }
    }

    let nodes = [];
    let graphReady = false;

    self.onmessage = function(e) {
      const { type, payload } = e.data;
      
      if (type === 'BUILD_GRAPH') {
        buildGraph(payload);
        self.postMessage({ type: 'GRAPH_READY' });
      } 
      else if (type === 'FIND_PATH') {
        if (!graphReady) return;
        const { startX, startY, endX, endY } = payload;
        const path = findPath(startX, startY, endX, endY);
        self.postMessage({ type: 'PATH_FOUND', payload: path });
      }
    };

    function buildGraph(locations) {
      const nodeMap = new Map();
      const roadSegments = [];
      
      Object.values(locations).forEach(loc => {
        if (loc.points && loc.points.length > 1) {
          roadSegments.push(loc.points);
        }
      });

      const getNode = (x, y) => {
        const key = `${Math.round(x * 10)},${Math.round(y * 10)}`;
        if (nodeMap.has(key)) return nodeMap.get(key);
        const idx = nodes.length;
        nodes.push({ x, y, neighbors: [] });
        nodeMap.set(key, idx);
        return idx;
      };

      // Build road connections
      roadSegments.forEach(pts => {
        for (let i = 0; i < pts.length - 1; i++) {
          const a = getNode(pts[i].x, pts[i].y);
          const b = getNode(pts[i + 1].x, pts[i + 1].y);
          const d = Math.hypot(pts[i].x - pts[i + 1].x, pts[i].y - pts[i + 1].y);
          nodes[a].neighbors.push({ idx: b, dist: d });
          nodes[b].neighbors.push({ idx: a, dist: d });
        }
      });

      // Build spatial grid for intersection connections
      const grid = new Map();
      const CELL = 25;
      nodes.forEach((node, idx) => {
        const k = `${Math.floor(node.x / CELL)},${Math.floor(node.y / CELL)}`;
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(idx);
      });

      // Connect nearby nodes (intersections)
      const MAX_DIST = 22;
      nodes.forEach((nodeA, idxA) => {
        const cx = Math.floor(nodeA.x / CELL);
        const cy = Math.floor(nodeA.y / CELL);
        
        for (let x = cx - 1; x <= cx + 1; x++) {
          for (let y = cy - 1; y <= cy + 1; y++) {
            const k = `${x},${y}`;
            if (!grid.has(k)) continue;
            
            grid.get(k).forEach(idxB => {
              if (idxA >= idxB) return;
              if (nodeA.neighbors.some(n => n.idx === idxB)) return;
              
              const nodeB = nodes[idxB];
              const d = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y);
              
              if (d < MAX_DIST) {
                nodes[idxA].neighbors.push({ idx: idxB, dist: d * 3 });
                nodes[idxB].neighbors.push({ idx: idxA, dist: d * 3 });
              }
            });
          }
        }
      });
      
      graphReady = true;
    }

    function findNearestNode(x, y) {
      let best = -1;
      let minD = Infinity;
      for (let i = 0; i < nodes.length; i++) {
        const d = (nodes[i].x - x) ** 2 + (nodes[i].y - y) ** 2;
        if (d < minD) { minD = d; best = i; }
      }
      return (minD < 100000) ? best : -1;
    }

    function findPath(sx, sy, ex, ey) {
      const start = findNearestNode(sx, sy);
      const end = findNearestNode(ex, ey);
      if (start === -1 || end === -1) return null;

      const came = new Map();
      const cost = new Map();
      const pq = new PriorityQueue();

      pq.enqueue(start, 0);
      cost.set(start, 0);

      while (!pq.isEmpty()) {
        const curr = pq.dequeue().element;
        if (curr === end) {
          const path = [nodes[curr]];
          let c = curr;
          while (came.has(c)) {
            c = came.get(c);
            path.unshift(nodes[c]);
          }
          return path;
        }

        for (const next of nodes[curr].neighbors) {
          const newCost = (cost.get(curr) || 0) + next.dist;
          if (!cost.has(next.idx) || newCost < cost.get(next.idx)) {
            cost.set(next.idx, newCost);
            const h = Math.hypot(nodes[next.idx].x - ex, nodes[next.idx].y - ey);
            pq.enqueue(next.idx, newCost + h);
            came.set(next.idx, curr);
          }
        }
      }
      return null;
    }
  </script>

  <script type="module">
    import { getTrackConfig, worldToCanvas } from './track_configs.js';
    import { TC_LOCATIONS } from './tc_locations.js';

    // ===== GLOBALS =====
    const LFS_COLORS = {
      '0': '#000', '1': '#f03e3e', '2': '#40c057', '3': '#fcc419',
      '4': '#228be6', '5': '#da77f2', '6': '#15aabf', '7': '#fff',
      '8': '#fd7e14', '9': '#868e96'
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const state = {
      cars: new Map(),
      camera: { x: 0, y: 0, zoom: 1 },
      track: { config: getTrackConfig('BL'), img: new Image() },
      nav: { target: null, path: null, distance: 0 },
      ui: { following: null, dragging: false, lastDrag: { x: 0, y: 0 }, gpsEnabled: true, soundEnabled: false },
      voice: { lastTurn: null, lastTurnTime: 0, avgSpeed: 0 }
    };

    // ===== WORKER =====
    const blob = new Blob([document.getElementById('worker-code').textContent], { type: 'text/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));
    let workerBusy = false;

    document.getElementById('loader').classList.add('show');
    worker.postMessage({ type: 'BUILD_GRAPH', payload: TC_LOCATIONS });

    // ===== LISTEN FOR DEBUG REQUESTS =====
    window.addEventListener('message', (event) => {
      if (event.data.type === 'DEBUG_ROUTE') {
        const { from, to, destName } = event.data;
        
        console.log('🔍 DEBUG MODE: Calculating route from', from, 'to', to);
        
        // Najdi nejbližší nav bod k FROM
        let minDist = Infinity;
        let startNode = null;
        navPoints.forEach(pt => {
          const d = Math.hypot(pt.x - from.x, pt.y - from.y);
          if (d < minDist) {
            minDist = d;
            startNode = pt;
          }
        });
        
        // Najdi nejbližší nav bod k TO
        minDist = Infinity;
        let endNode = null;
        navPoints.forEach(pt => {
          const d = Math.hypot(pt.x - to.x, pt.y - to.y);
          if (d < minDist) {
            minDist = d;
            endNode = pt;
          }
        });
        
        if (!startNode || !endNode) {
          console.error('❌ Could not find nav points');
          return;
        }
        
        console.log('📍 Start node:', startNode, 'End node:', endNode);
        
        // Vypočti trasu
        worker.postMessage({
          type: 'FIND_PATH',
          start: startNode,
          end: endNode
        });
        
        // Počkej na výsledek
        const originalHandler = worker.onmessage;
        worker.onmessage = (e) => {
          if (e.data.type === 'PATH_FOUND') {
            const rawPath = e.data.payload;
            
            if (!rawPath || rawPath.length < 2) {
              console.error('❌ No path found');
              return;
            }
            
            // SMOOTHING
            const smoothedPath = [];
            for (let i = 0; i < rawPath.length - 1; i++) {
              smoothedPath.push(rawPath[i]);
              
              const dx = rawPath[i+1].x - rawPath[i].x;
              const dy = rawPath[i+1].y - rawPath[i].y;
              const segmentDist = Math.hypot(dx, dy);
              
              if (segmentDist > 10) {
                const numIntermediate = Math.floor(segmentDist / 10);
                for (let j = 1; j <= numIntermediate; j++) {
                  const t = j / (numIntermediate + 1);
                  smoothedPath.push({
                    x: rawPath[i].x + dx * t,
                    y: rawPath[i].y + dy * t
                  });
                }
              }
            }
            smoothedPath.push(rawPath[rawPath.length - 1]);
            
            console.log(`📍 Path smoothing: ${rawPath.length} → ${smoothedPath.length} points`);
            
            // Analyzuj každý bod (použij existující funkci detectTurn)
            const analysis = [];
            const WIN = 4;
            
            for (let i = 0; i < smoothedPath.length; i++) {
              if (i >= WIN && i < smoothedPath.length - WIN) {
                // Použij inline detekci místo volání funkce
                let dist = 0;
                for (let j = 1; j <= i; j++) {
                  dist += Math.hypot(smoothedPath[j].x - smoothedPath[j-1].x, smoothedPath[j].y - smoothedPath[j-1].y);
                }
                
                if (dist > 150) {
                  analysis[i] = { skip: 'too_far', dist };
                } else if (dist < 50) {
                  analysis[i] = { skip: 'too_close', dist };
                } else {
                  let before = 0, after = 0, cntB = 0, cntA = 0;
                  
                  for (let j = Math.max(1, i - WIN); j < i; j++) {
                    const dx = smoothedPath[j].x - smoothedPath[j-1].x;
                    const dy = smoothedPath[j].y - smoothedPath[j-1].y;
                    const d = Math.hypot(dx, dy);
                    if (d > 5) { before += Math.atan2(dy, dx); cntB++; }
                  }
                  
                  for (let j = i; j < Math.min(i + WIN, smoothedPath.length - 1); j++) {
                    const dx = smoothedPath[j+1].x - smoothedPath[j].x;
                    const dy = smoothedPath[j+1].y - smoothedPath[j].y;
                    const d = Math.hypot(dx, dy);
                    if (d > 5) { after += Math.atan2(dy, dx); cntA++; }
                  }
                  
                  if (cntB === 0 || cntA === 0) {
                    analysis[i] = { skip: 'no_segments', dist };
                  } else {
                    before /= cntB;
                    after /= cntA;
                    
                    let diff = after - before;
                    while (diff > Math.PI) diff -= 2 * Math.PI;
                    while (diff < -Math.PI) diff += 2 * Math.PI;
                    
                    const deg = Math.abs(diff * 180 / Math.PI);
                    
                    if (deg > 45) {
                      let turnType;
                      if (deg < 85) {
                        turnType = diff > 0 ? 'slight_left' : 'slight_right';
                      } else {
                        turnType = diff > 0 ? 'left' : 'right';
                      }
                      analysis[i] = { type: turnType, dist, angle: deg, detected: true };
                    } else {
                      analysis[i] = { skip: 'angle_too_small', dist, angle: deg };
                    }
                  }
                }
              } else {
                analysis[i] = { skip: 'boundary' };
              }
            }
            
            // Pošli zpátky do debug okna
            window.parent.postMessage({
              type: 'DEBUG_PATH',
              path: smoothedPath,
              analysis: analysis
            }, '*');
            
            console.log('✅ Sent path analysis to debug window');
          }
          
          // Restore original handler
          worker.onmessage = originalHandler;
        };
      }
    });

    worker.onmessage = (e) => {
      if (e.data.type === 'GRAPH_READY') {
        document.getElementById('loader').classList.remove('show');
      }
      else if (e.data.type === 'PATH_FOUND') {
        workerBusy = false;
        if (e.data.payload && e.data.payload.length > 1) {
          // SMOOTHING: Přidáme mezibody pro lepší detekci zatáček
          const rawPath = e.data.payload;
          const smoothedPath = [];
          
          for (let i = 0; i < rawPath.length - 1; i++) {
            smoothedPath.push(rawPath[i]);
            
            // Přidej mezibody každých 10m
            const dx = rawPath[i+1].x - rawPath[i].x;
            const dy = rawPath[i+1].y - rawPath[i].y;
            const segmentDist = Math.hypot(dx, dy);
            
            if (segmentDist > 10) {
              const numIntermediate = Math.floor(segmentDist / 10);
              for (let j = 1; j <= numIntermediate; j++) {
                const t = j / (numIntermediate + 1);
                smoothedPath.push({
                  x: rawPath[i].x + dx * t,
                  y: rawPath[i].y + dy * t
                });
              }
            }
          }
          smoothedPath.push(rawPath[rawPath.length - 1]);
          
          console.log(`📍 Path smoothing: ${rawPath.length} → ${smoothedPath.length} points`);
          
          state.nav.path = smoothedPath;
          state.nav.distance = calcPathDistance(smoothedPath);
        }
      }
    };

    // ===== WEBSOCKET =====
    const ws = new WebSocket(`ws://${window.location.host}`);
    
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      
      if (data.type === 'track') {
        loadTrack(data.track);
      }
      else if (data.type === 'positions') {
        const valid = new Set();
        data.cars.forEach(c => {
          state.cars.set(c.plid, c);
          valid.add(c.plid);
        });
        for (let k of state.cars.keys()) {
          if (!valid.has(k)) state.cars.delete(k);
        }
        updatePlayerList();
      }
    };

    // ===== NAVIGATION =====
    function setTarget(name, coords, icon) {
      state.nav.target = { name, x: coords.x, y: coords.y, icon, points: coords.points || null };
      state.nav.path = null;
      state.voice.lastTurn = null;
      requestPath();
      hideSearch();
    }

    function requestPath() {
      if (!state.nav.target || !state.ui.following || workerBusy) return;
      const me = state.cars.get(state.ui.following);
      if (!me) return;

      let tx = state.nav.target.x;
      let ty = state.nav.target.y;

      // Snap to road if possible
      if (state.nav.target.points && state.nav.target.points.length > 0) {
        let minD = Infinity;
        let best = null;
        for (const pt of state.nav.target.points) {
          const d = Math.hypot(pt.x - tx, pt.y - ty);
          if (d < minD) { minD = d; best = pt; }
        }
        if (best && minD < 50) {
          tx = best.x;
          ty = best.y;
        }
      }

      workerBusy = true;
      worker.postMessage({
        type: 'FIND_PATH',
        payload: { startX: me.x, startY: me.y, endX: tx, endY: ty }
      });
    }

    setInterval(requestPath, 1000);

    function stopNav() {
      state.nav.target = null;
      state.nav.path = null;
      document.getElementById('hud').classList.remove('active');
    }

    // ===== TURN DETECTION - NOVÝ ALGORITMUS =====
    function detectTurn(path) {
      try {
        if (!path || path.length < 5) return null;
        
        // Najdi první bod ve vzdálenosti 50-150m
        let targetIdx = null;
        let dist = 0;
        
        for (let i = 1; i < Math.min(path.length, 50); i++) {
          dist += Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
          
          if (dist >= 50 && dist <= 150) {
            targetIdx = i;
            break;
          }
          
          if (dist > 150) break;
        }
        
        if (!targetIdx || targetIdx < 3 || targetIdx >= path.length - 3) {
          return null;
        }
        
        // Spočítej směr PŘED zatáčkou (průměr 3 bodů před)
        let beforeAngle = 0;
        let beforeCount = 0;
        for (let i = Math.max(0, targetIdx - 4); i < targetIdx - 1; i++) {
          const dx = path[i+1].x - path[i].x;
          const dy = path[i+1].y - path[i].y;
          if (Math.hypot(dx, dy) > 1) {
            beforeAngle += Math.atan2(dy, dx);
            beforeCount++;
          }
        }
        if (beforeCount === 0) return null;
        beforeAngle /= beforeCount;
        
        // Spočítej směr PO zatáčce (průměr 3 bodů po)
        let afterAngle = 0;
        let afterCount = 0;
        for (let i = targetIdx + 1; i < Math.min(targetIdx + 5, path.length - 1); i++) {
          const dx = path[i+1].x - path[i].x;
          const dy = path[i+1].y - path[i].y;
          if (Math.hypot(dx, dy) > 1) {
            afterAngle += Math.atan2(dy, dx);
            afterCount++;
          }
        }
        if (afterCount === 0) return null;
        afterAngle /= afterCount;
        
        // Vypočti rozdíl úhlů
        let angleDiff = afterAngle - beforeAngle;
        
        // Normalizuj do -PI až PI
        while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
        
        const angleDeg = Math.abs(angleDiff * 180 / Math.PI);
        
        // Je to zatáčka? (alespoň 40° - ignoruje mírné záhyby silnice)
        if (angleDeg < 40) {
          return null;
        }
        
        // Urči typ zatáčky
        let turnType;
        const isLeft = angleDiff > 0;
        
        if (angleDeg < 60) {
          // Mírná zatáčka (40-60°)
          turnType = isLeft ? 'slight_left' : 'slight_right';
        } else if (angleDeg < 120) {
          // Normální zatáčka (60-120°)
          turnType = isLeft ? 'left' : 'right';
        } else {
          // Ostrá zatáčka (120°+)
          turnType = isLeft ? 'sharp_left' : 'sharp_right';
        }
        
        console.log(`🔄 TURN DETECTED: ${turnType} at ${dist.toFixed(0)}m (${angleDeg.toFixed(1)}°)`);
        
        return {
          type: turnType,
          dist: dist,
          angle: angleDeg,
          point: path[targetIdx]
        };
      } catch (error) {
        console.error('❌ TURN DETECTION ERROR:', error);
        console.log('🔍 Path data:', JSON.stringify({
          pathLength: path?.length,
          firstPoints: path?.slice(0, 5),
          lastPoints: path?.slice(-5)
        }, null, 2));
        return null;
      }
    }

    // ===== VOICE =====
    function speak(text) {
      if (!state.ui.soundEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 1.1;
      window.speechSynthesis.speak(u);
    }

    // ===== RENDER =====
    function render() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Camera follow
      if (state.ui.following !== null && !state.ui.dragging) {
        const car = state.cars.get(state.ui.following);
        if (car) {
          const p = worldToCanvas(car.x, car.y, state.track.config, state.track.img.width, state.track.img.height);
          state.camera.x = canvas.width / 2 - p.x * state.camera.zoom;
          state.camera.y = canvas.height / 2 - p.y * state.camera.zoom;
        }
      }

      ctx.save();
      ctx.translate(state.camera.x, state.camera.y);
      ctx.scale(state.camera.zoom, state.camera.zoom);

      // Track
      if (state.track.img.complete) {
        ctx.drawImage(state.track.img, 0, 0);
      }

      // Path
      if (state.ui.gpsEnabled && state.nav.path && state.nav.path.length > 1) {
        const me = state.cars.get(state.ui.following);
        
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        
        if (me) {
          const sp = worldToCanvas(me.x, me.y, state.track.config, state.track.img.width, state.track.img.height);
          ctx.moveTo(sp.x, sp.y);
        }
        
        state.nav.path.forEach((pt, i) => {
          const p = worldToCanvas(pt.x, pt.y, state.track.config, state.track.img.width, state.track.img.height);
          if (i === 0 && !me) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        
        ctx.lineWidth = 14;
        ctx.strokeStyle = 'rgba(74, 158, 255, 0.4)';
        ctx.stroke();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#4a9eff';
        ctx.stroke();

        // Destination marker
        if (state.nav.target) {
          const tp = worldToCanvas(state.nav.target.x, state.nav.target.y, state.track.config, state.track.img.width, state.track.img.height);
          const pulse = 8 + Math.sin(Date.now() / 300) * 4;
          
          ctx.fillStyle = 'rgba(74, 158, 255, 0.2)';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, pulse + 20, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#4a9eff';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, 15, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, 8, 0, Math.PI * 2);
          ctx.fill();
          
          if (state.nav.target.icon) {
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(state.nav.target.icon, tp.x, tp.y - 40);
          }
        }

        // Update HUD
        if (me) {
          const dist = Math.hypot(me.x - state.nav.target.x, me.y - state.nav.target.y);
          
          if (dist < 25) {
            stopNav();
            if (state.ui.soundEnabled) speak('You have arrived at your destination.');
          } else {
            state.voice.avgSpeed = state.voice.avgSpeed * 0.95 + me.speed * 0.05;
            const effSpeed = (state.voice.avgSpeed * 3.6 < 10) ? 13.8 : state.voice.avgSpeed;
            const timeMin = (state.nav.distance / effSpeed) / 60;

            document.getElementById('hud').classList.add('active');
            document.getElementById('timeEta').textContent = formatTime(timeMin);
            document.getElementById('distance').textContent = formatDist(state.nav.distance);
            document.getElementById('arrival').textContent = getArrival(timeMin);
            document.getElementById('targetName').textContent = stripColors(state.nav.target.name);

            // Turn detection & voice guidance
            const turn = detectTurn(state.nav.path);
            const icon = document.getElementById('turnIcon');
            
            if (turn) {
              // Ikony podle typu odbočky
              if (turn.type === 'slight_left') icon.textContent = '↖️';
              else if (turn.type === 'slight_right') icon.textContent = '↗️';
              else if (turn.type === 'left') icon.textContent = '⬅️';
              else if (turn.type === 'right') icon.textContent = '➡️';
              else if (turn.type === 'sharp_left') icon.textContent = '↩️';
              else if (turn.type === 'sharp_right') icon.textContent = '↪️';
              
              // Reset když PROJÍŽDÍŠ zatáčku (blíž než 20m)
              if (turn.dist < 20 && state.voice.lastTurn) {
                console.log(`✅ Turn passed (${turn.dist.toFixed(0)}m), resetting voice state`);
                state.voice.lastTurn = null;
                state.voice.lastTurnTime = 0;
              }
              
              // Hlasová navigace - JEDNODUŠŠÍ SYSTÉM
              if (state.ui.soundEnabled) {
                const now = Date.now();
                const timeSince = now - state.voice.lastTurnTime;
                const d = Math.round(turn.dist);
                
                const turnText = {
                  'slight_left': 'turn slightly left',
                  'slight_right': 'turn slightly right', 
                  'left': 'turn left',
                  'right': 'turn right',
                  'sharp_left': 'turn sharp left',
                  'sharp_right': 'turn sharp right'
                }[turn.type] || 'continue straight';
                
                let shouldSpeak = false;
                let message = '';
                
                // Hlášení podle vzdálenosti:
                // 1. První varování: 100-120m
                if (d >= 100 && d <= 120 && timeSince > 10000) {
                  shouldSpeak = true;
                  message = `In ${d} meters ${turnText}`;
                  state.voice.lastTurn = `warn1_${turn.type}_${turn.dist}`;
                  state.voice.lastTurnTime = now;
                }
                // 2. Druhé varování: 70-90m
                else if (d >= 70 && d < 90 && timeSince > 7000) {
                  shouldSpeak = true;
                  message = `In ${d} meters ${turnText}`;
                  state.voice.lastTurn = `warn2_${turn.type}_${turn.dist}`;
                  state.voice.lastTurnTime = now;
                }
                // 3. Poslední varování: 40-60m
                else if (d >= 40 && d < 60 && timeSince > 5000) {
                  shouldSpeak = true;
                  message = `${turnText.charAt(0).toUpperCase() + turnText.slice(1)}`;
                  state.voice.lastTurn = `final_${turn.type}_${turn.dist}`;
                  state.voice.lastTurnTime = now;
                }
                
                if (shouldSpeak) {
                  console.log(`🔊 VOICE: "${message}" (dist: ${d}m, angle: ${turn.angle.toFixed(1)}°)`);
                  speak(message);
                }
              }
            } else {
              icon.textContent = '⬆️';
            }
          }
        }
      } else {
        document.getElementById('hud').classList.remove('active');
      }

      // Cars
      state.cars.forEach(car => {
        const p = worldToCanvas(car.x, car.y, state.track.config, state.track.img.width, state.track.img.height);
        const isMe = car.plid === state.ui.following;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-car.heading * Math.PI / 180);

        if (isMe) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 100, -Math.PI * 0.75, -Math.PI * 0.25);
          ctx.fillStyle = 'rgba(74, 158, 255, 0.2)';
          ctx.fill();
        }

        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(8, 10);
        ctx.lineTo(0, 6);
        ctx.lineTo(-8, 10);
        ctx.closePath();
        ctx.fillStyle = isMe ? '#4a9eff' : '#fff';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#777';
        ctx.stroke();
        ctx.restore();

        // Name tag
        if (state.camera.zoom > 0.6) {
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          const segs = parseLFSColors(car.name);
          let w = 0;
          segs.forEach(s => w += ctx.measureText(s.text).width);
          
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.beginPath();
          ctx.roundRect(p.x - w/2 - 6, p.y - 30, w + 12, 18, 9);
          ctx.fill();
          
          let x = p.x - w/2;
          segs.forEach(s => {
            ctx.fillStyle = (s.color === '#fff' || s.color === '#ffffff') ? '#000' : s.color;
            ctx.fillText(s.text, x + ctx.measureText(s.text).width/2, p.y - 17);
            x += ctx.measureText(s.text).width;
          });
        }
      });

      ctx.restore();
      requestAnimationFrame(render);
    }

    // ===== SEARCH =====
    function search() {
      const val = document.getElementById('searchBox').value.toLowerCase();
      const cont = document.getElementById('searchResults');
      cont.innerHTML = '';
      
      if (val.length < 2) {
        cont.classList.remove('show');
        return;
      }

      const locs = Object.entries(TC_LOCATIONS)
        .filter(([n]) => n.toLowerCase().includes(val))
        .slice(0, 5);
      
      const plys = Array.from(state.cars.values())
        .filter(c => stripColors(c.name).toLowerCase().includes(val))
        .slice(0, 5);

      if (locs.length) {
        cont.innerHTML += `<div class="result-group"><div class="result-label">MÍSTA</div>`;
        locs.forEach(([n, d]) => {
          cont.innerHTML += `<div class="result-item" onclick="selectLocation('${n}')">
            <span class="result-icon">${d.icon}</span>
            <span class="result-name">${n}</span>
          </div>`;
        });
        cont.innerHTML += '</div>';
      }

      if (plys.length) {
        cont.innerHTML += `<div class="result-group"><div class="result-label">HRÁČI</div>`;
        plys.forEach(c => {
          cont.innerHTML += `<div class="result-item" onclick="followPlayer(${c.plid})">
            <span class="result-icon">👤</span>
            <span class="result-name">${lfsToHTML(c.name)}</span>
          </div>`;
        });
        cont.innerHTML += '</div>';
      }

      cont.classList.add('show');
    }

    function hideSearch() {
      document.getElementById('searchResults').classList.remove('show');
      document.getElementById('searchBox').value = '';
    }

    window.selectLocation = (name) => {
      const data = TC_LOCATIONS[name];
      if (data) setTarget(name, data, data.icon);
    };

    window.followPlayer = (plid) => {
      state.ui.following = plid;
      hideSearch();
    };

    // ===== PLAYER LIST =====
    function updatePlayerList() {
      document.getElementById('onlineCount').textContent = `${state.cars.size} online`;
      document.getElementById('playerCount').textContent = `${state.cars.size} HRÁČŮ`;
      
      const items = document.getElementById('playerItems');
      items.innerHTML = Array.from(state.cars.values())
        .map(c => `<div class="player-item" onclick="followPlayer(${c.plid})">${lfsToHTML(c.name)}</div>`)
        .join('');
    }

    // ===== UI CONTROLS =====
    document.getElementById('searchBox').addEventListener('input', search);
    document.getElementById('searchBox').addEventListener('focus', search);
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchBox') && !e.target.closest('#searchResults')) {
        hideSearch();
      }
    });

    document.getElementById('closeNav').addEventListener('click', stopNav);
    
    document.getElementById('zoomInBtn').addEventListener('click', () => zoom(1.2));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoom(0.8));
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.camera.zoom = 1;
      state.camera.x = canvas.width / 2 - state.track.img.width / 2;
      state.camera.y = canvas.height / 2 - state.track.img.height / 2;
      state.ui.following = null;
    });
    
    document.getElementById('gpsBtn').addEventListener('click', () => {
      state.ui.gpsEnabled = !state.ui.gpsEnabled;
      document.getElementById('gpsBtn').classList.toggle('active');
    });
    
    document.getElementById('soundBtn').addEventListener('click', () => {
      state.ui.soundEnabled = !state.ui.soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.textContent = state.ui.soundEnabled ? '🔊' : '🔇';
      if (state.ui.soundEnabled) speak('Sound Navigation is on.');
    });
    
    document.getElementById('playersBtn').addEventListener('click', () => {
      document.getElementById('playerList').classList.toggle('show');
    });

    // Canvas controls
    // Canvas controls - Mouse events
    canvas.addEventListener('mousedown', (e) => {
      state.ui.dragging = true;
      state.ui.lastDrag = { x: e.clientX, y: e.clientY };
    });
    
    window.addEventListener('mouseup', () => {
      state.ui.dragging = false;
    });
    
    window.addEventListener('mousemove', (e) => {
      if (state.ui.dragging) {
        state.camera.x += e.clientX - state.ui.lastDrag.x;
        state.camera.y += e.clientY - state.ui.lastDrag.y;
        state.ui.lastDrag = { x: e.clientX, y: e.clientY };
      }
    });
    
    // Canvas controls - Touch events (mobile)
    let lastTouchDistance = 0;
    
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 1) {
        // Single touch - pan
        state.ui.dragging = true;
        state.ui.lastDrag = { 
          x: e.touches[0].clientX, 
          y: e.touches[0].clientY 
        };
      } else if (e.touches.length === 2) {
        // Two finger - prepare for pinch zoom
        state.ui.dragging = false;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        lastTouchDistance = Math.hypot(dx, dy);
      }
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 1 && state.ui.dragging) {
        // Single touch - pan
        const touch = e.touches[0];
        state.camera.x += touch.clientX - state.ui.lastDrag.x;
        state.camera.y += touch.clientY - state.ui.lastDrag.y;
        state.ui.lastDrag = { x: touch.clientX, y: touch.clientY };
      } else if (e.touches.length === 2) {
        // Two finger - pinch zoom
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const distance = Math.hypot(dx, dy);
        
        if (lastTouchDistance > 0) {
          const scale = distance / lastTouchDistance;
          const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          zoom(scale, centerX, centerY);
        }
        
        lastTouchDistance = distance;
      }
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      state.ui.dragging = false;
      lastTouchDistance = 0;
    }, { passive: false });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
    }, { passive: false });

    // ===== HELPERS =====
    function zoom(factor, mx, my) {
      const x = mx || canvas.width / 2;
      const y = my || canvas.height / 2;
      const wx = (x - state.camera.x) / state.camera.zoom;
      const wy = (y - state.camera.y) / state.camera.zoom;
      const nz = Math.max(0.1, Math.min(state.camera.zoom * factor, 10));
      state.camera.x = x - wx * nz;
      state.camera.y = y - wy * nz;
      state.camera.zoom = nz;
    }

    function loadTrack(code) {
      const s = code.substring(0, 2);
      state.track.config = getTrackConfig(s);
      const img = new Image();
      img.src = `tracks/track_${s}.png`;
      img.onload = () => {
        state.track.img = img;
        document.getElementById('loader').classList.remove('show');
      };
    }

    function calcPathDistance(path) {
      let d = 0;
      for (let i = 0; i < path.length - 1; i++) {
        d += Math.hypot(path[i].x - path[i+1].x, path[i].y - path[i+1].y);
      }
      return d;
    }

    function formatTime(m) {
      if (m < 1) return '1 min';
      if (m >= 60) {
        const h = Math.floor(m / 60);
        const r = Math.round(m % 60);
        return `${h} h ${r} min`;
      }
      return `${Math.round(m)} min`;
    }

    function formatDist(d) {
      return d > 1000 ? `${(d/1000).toFixed(1)} km` : `${Math.round(d)} m`;
    }

    function getArrival(m) {
      const n = new Date();
      const f = new Date(n.getTime() + m * 60000);
      return f.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function parseLFSColors(t) {
      if (!t) return [{ text: '', color: '#000' }];
      const s = [];
      let c = '#000', curr = '';
      for (let i = 0; i < t.length; i++) {
        if (t[i] === '^' && i + 1 < t.length) {
          const k = t[i + 1].toLowerCase();
          if (LFS_COLORS[k]) {
            if (curr) s.push({ text: curr, color: c });
            c = LFS_COLORS[k];
            curr = '';
            i++;
            continue;
          }
          if (['l', 'g', 'c', 'j', 'e', 't', 'b', 'h', 's', 'k'].includes(k)) {
            i++;
            continue;
          }
        }
        curr += t[i];
      }
      if (curr) s.push({ text: curr, color: c });
      return s;
    }

    function lfsToHTML(t) {
      return parseLFSColors(t).map(s => `<span style="color:${s.color}">${s.text}</span>`).join('');
    }

    function stripColors(t) {
      return t ? t.replace(/\^[0-9a-zA-Z]/g, '') : '';
    }

    // ===== ERROR HANDLING & DEBUG LOGGING =====
    // Global error handler - automaticky loguje JSON debug info
    window.addEventListener('error', (event) => {
      console.error('❌ RUNTIME ERROR:', event.error);
      
      // Loguj stav aplikace
      const debugInfo = {
        error: {
          message: event.error?.message,
          stack: event.error?.stack
        },
        state: {
          hasPath: !!state.nav.path,
          pathLength: state.nav.path?.length || 0,
          hasTarget: !!state.nav.target,
          targetName: state.nav.target?.name,
          following: state.ui.following,
          carsCount: state.cars.size
        },
        timestamp: new Date().toISOString()
      };
      
      console.log('🔍 DEBUG INFO:', JSON.stringify(debugInfo, null, 2));
    });

    // ===== PREVENT DOUBLE-TAP ZOOM (iOS) =====
    let lastTapTime = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault(); // Prevent double-tap zoom
      }
      lastTapTime = now;
    }, { passive: false });

    // ===== START =====
    loadTrack('BL1');
    render();
  </script>
</body>
