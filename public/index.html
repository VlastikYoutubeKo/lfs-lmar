<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LFS Maps Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      /* Mobile optimizations */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overscroll-behavior: none; /* Prevent pull-to-refresh */
    }
    
    #map { 
      position: fixed; 
      inset: 0; 
      background: #1a1a1a;
    }
    
    canvas { 
      display: block; 
      width: 100%; 
      height: 100%;
      touch-action: none; /* Disable browser touch gestures */
    }
    
    /* ===== NAVIGATION BAR ===== */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      z-index: 1000;
    }
    
    #navbar h1 {
      font-size: 20px;
      font-weight: 600;
      color: #4a9eff;
    }
    
    #searchBox {
      flex: 1;
      max-width: 500px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 0 20px;
      color: #fff;
      font-size: 16px; /* 16px prevents iOS auto-zoom */
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none; /* Remove iOS default styling */
      -webkit-user-select: text; /* Allow text selection in input */
      user-select: text;
    }
    
    #searchBox:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: #4a9eff;
    }
    
    #searchResults {
      position: absolute;
      top: 65px;
      left: 20px;
      width: 500px;
      max-height: 400px;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow-y: auto;
      display: none;
    }
    
    #searchResults.show { display: block; }
    
    .result-group {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .result-group:last-child { border: none; }
    
    .result-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .result-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    
    .result-item:hover {
      background: rgba(74, 158, 255, 0.15);
    }
    
    .result-icon {
      font-size: 20px;
      width: 30px;
      text-align: center;
    }
    
    .result-name {
      flex: 1;
      font-size: 14px;
    }
    
    /* ===== HUD (NAVIGATION) ===== */
    #hud {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 24px;
      display: none;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      min-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    
    #hud.active { display: flex; }
    
    #turnIcon {
      font-size: 48px;
      width: 60px;
      text-align: center;
    }
    
    #hudInfo {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    #timeRow {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    
    #timeEta {
      font-size: 32px;
      font-weight: 700;
      color: #4a9eff;
    }
    
    #distance {
      font-size: 18px;
      color: #888;
    }
    
    #metaRow {
      display: flex;
      gap: 12px;
      font-size: 14px;
      color: #aaa;
    }
    
    #arrival { font-weight: 600; }
    
    #targetName {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    #closeNav {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    
    #closeNav:hover {
      background: rgba(255, 70, 70, 0.2);
      color: #ff4646;
    }
    
    /* ===== CONTROLS ===== */
    #controls {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }
    
    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    
    .control-btn:hover {
      background: rgba(74, 158, 255, 0.2);
      border-color: #4a9eff;
      transform: scale(1.1);
    }
    
    .control-btn.active {
      background: #4a9eff;
      color: #000;
    }
    
    /* ===== PLAYER LIST ===== */
    #playerList {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 250px;
      max-height: 400px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: none;
    }
    
    #playerList.show { display: block; }
    
    #playerCount {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .player-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    
    .player-item:hover {
      background: rgba(74, 158, 255, 0.15);
    }
    
    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(74, 158, 255, 0.95);
      color: #000;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 2000;
    }
    
    #loader.show { display: block; }
  </style>
</head>
<body>
  <!-- MAP -->
  <div id="map">
    <canvas id="canvas"></canvas>
  </div>
  
  <!-- NAVBAR -->
  <div id="navbar">
    <h1>🏁 LFS Maps</h1>
    <input type="text" id="searchBox" placeholder="Hledat místa nebo hráče..." />
    <div style="flex: 1;"></div>
    <div id="onlineCount" style="font-size: 13px; color: #888;">0 online</div>
  </div>
  
  <!-- SEARCH RESULTS -->
  <div id="searchResults"></div>
  
  <!-- HUD (Navigation) -->
  <div id="hud">
    <div id="turnIcon">⬆️</div>
    <div id="hudInfo">
      <div id="timeRow">
        <div id="timeEta">-- min</div>
        <div id="distance">-- km</div>
      </div>
      <div id="metaRow">
        <span id="arrival">--:--</span>
        <span>•</span>
        <span id="targetName">Cíl</span>
      </div>
    </div>
    <button id="closeNav">✕</button>
  </div>
  
  <!-- CONTROLS -->
  <div id="controls">
    <button class="control-btn" id="zoomInBtn">+</button>
    <button class="control-btn" id="zoomOutBtn">−</button>
    <button class="control-btn" id="resetBtn">⌂</button>
    <button class="control-btn active" id="gpsBtn">📍</button>
    <button class="control-btn" id="soundBtn">🔇</button>
    <button class="control-btn" id="playersBtn">👥</button>
    <button class="control-btn" id="algoBtn" title="Pathfinding algoritmus">A*</button>
  </div>
  
  <!-- PLAYER LIST -->
  <div id="playerList">
    <div id="playerCount">0 HRÁČŮ</div>
    <div id="playerItems"></div>
  </div>
  
  <!-- LOADER -->
  <div id="loader">Načítám navigační graf...</div>

  <!-- WORKER CODE -->
  <script id="worker-code" type="javascript/worker">
    // Přeposlání console.log do hlavního vlákna
    const originalLog = console.log;
    console.log = function(...args) {
      originalLog.apply(console, args);
      self.postMessage({ type: 'WORKER_LOG', payload: args.map(a => String(a)).join(' ') });
    };
    
    class PriorityQueue {
      constructor() { this.items = []; }
      enqueue(element, priority) {
        const qElement = { element, priority };
        let added = false;
        for (let i = 0; i < this.items.length; i++) {
          if (this.items[i].priority > qElement.priority) {
            this.items.splice(i, 0, qElement);
            added = true;
            break;
          }
        }
        if (!added) this.items.push(qElement);
      }
      dequeue() { return this.items.shift(); }
      isEmpty() { return this.items.length === 0; }
    }

    let nodes = [];
    let graphReady = false;
    let pathfindingAlgorithm = 'astar'; // 'astar', 'dijkstra', 'bidirectional', 'greedy'

    self.onmessage = function(e) {
      const { type, payload } = e.data;
      
      if (type === 'BUILD_GRAPH') {
        buildGraph(payload);
        self.postMessage({ type: 'GRAPH_READY' });
      } 
      else if (type === 'FIND_PATH') {
        if (!graphReady) return;
        const { startX, startY, endX, endY } = payload;
        
        // Použij vybraný algoritmus
        let path = null;
        switch (pathfindingAlgorithm) {
          case 'dijkstra':
            path = findPathDijkstra(startX, startY, endX, endY);
            break;
          case 'bidirectional':
            path = findPathBidirectional(startX, startY, endX, endY);
            break;
          case 'greedy':
            path = findPathGreedy(startX, startY, endX, endY);
            break;
          default:
            path = findPathAStar(startX, startY, endX, endY);
        }
          
        self.postMessage({ type: 'PATH_FOUND', payload: path });
      }
      else if (type === 'SET_ALGORITHM') {
        pathfindingAlgorithm = payload;
        console.log(`🔧 Pathfinding algoritmus změněn na: ${pathfindingAlgorithm}`);
      }
    };

    function buildGraph(locations) {
      const nodeMap = new Map();
      const roadSegments = [];
      
      Object.values(locations).forEach(loc => {
        if (loc.points && loc.points.length > 1) {
          roadSegments.push(loc.points);
        }
      });

      const getNode = (x, y) => {
        const key = `${Math.round(x * 10)},${Math.round(y * 10)}`;
        if (nodeMap.has(key)) return nodeMap.get(key);
        const idx = nodes.length;
        nodes.push({ x, y, neighbors: [] });
        nodeMap.set(key, idx);
        return idx;
      };

      // Build road connections
      roadSegments.forEach(pts => {
        for (let i = 0; i < pts.length - 1; i++) {
          const a = getNode(pts[i].x, pts[i].y);
          const b = getNode(pts[i + 1].x, pts[i + 1].y);
          const d = Math.hypot(pts[i].x - pts[i + 1].x, pts[i].y - pts[i + 1].y);
          nodes[a].neighbors.push({ idx: b, dist: d });
          nodes[b].neighbors.push({ idx: a, dist: d });
        }
      });

      // Build spatial grid for intersection connections
      const grid = new Map();
      const CELL = 25;
      nodes.forEach((node, idx) => {
        const k = `${Math.floor(node.x / CELL)},${Math.floor(node.y / CELL)}`;
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(idx);
      });

      // Connect nearby nodes (intersections)
      const MAX_DIST = 22;
      nodes.forEach((nodeA, idxA) => {
        const cx = Math.floor(nodeA.x / CELL);
        const cy = Math.floor(nodeA.y / CELL);
        
        for (let x = cx - 1; x <= cx + 1; x++) {
          for (let y = cy - 1; y <= cy + 1; y++) {
            const k = `${x},${y}`;
            if (!grid.has(k)) continue;
            
            grid.get(k).forEach(idxB => {
              if (idxA >= idxB) return;
              if (nodeA.neighbors.some(n => n.idx === idxB)) return;
              
              const nodeB = nodes[idxB];
              const d = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y);
              
              if (d < MAX_DIST) {
                // Vyšší penalizace (5x místo 3x) aby preferoval správné cesty přes křižovatky
                nodes[idxA].neighbors.push({ idx: idxB, dist: d * 5 });
                nodes[idxB].neighbors.push({ idx: idxA, dist: d * 5 });
              }
            });
          }
        }
      });
      
      graphReady = true;
    }

    function findNearestNode(x, y) {
      let best = -1;
      let minD = Infinity;
      const MAX_SEARCH_DIST = 500; // Zvětšený radius vyhledávání (z 316 na 500)
      
      for (let i = 0; i < nodes.length; i++) {
        const d = (nodes[i].x - x) ** 2 + (nodes[i].y - y) ** 2;
        if (d < minD) { minD = d; best = i; }
      }
      
      const actualDist = Math.sqrt(minD);
      if (actualDist > MAX_SEARCH_DIST) {
        console.log(`⚠️ Nearest node je ${actualDist.toFixed(0)}m daleko (limit ${MAX_SEARCH_DIST}m)`);
        return -1;
      }
      
      return best;
    }

    function findPathAStar(sx, sy, ex, ey) {
      const start = findNearestNode(sx, sy);
      const end = findNearestNode(ex, ey);
      if (start === -1 || end === -1) {
        console.log('❌ A* Pathfinding: Start nebo end node nenalezen');
        return null;
      }

      const startTime = Date.now();
      const MAX_ITERATIONS = 10000;
      const MAX_TIME = 2000;
      
      const came = new Map();
      const cost = new Map();
      const pq = new PriorityQueue();

      pq.enqueue(start, 0);
      cost.set(start, 0);
      
      let iterations = 0;

      while (!pq.isEmpty()) {
        iterations++;
        
        if (iterations % 100 === 0) {
          const elapsed = Date.now() - startTime;
          if (elapsed > MAX_TIME) {
            console.log(`⏱️ A* timeout after ${iterations} iterations (${elapsed}ms)`);
            return null;
          }
        }
        
        if (iterations > MAX_ITERATIONS) {
          console.log(`🔄 A* max iterations reached (${MAX_ITERATIONS})`);
          return null;
        }

        const curr = pq.dequeue().element;
        if (curr === end) {
          const path = [nodes[curr]];
          let c = curr;
          while (came.has(c)) {
            c = came.get(c);
            path.unshift(nodes[c]);
          }
          const elapsed = Date.now() - startTime;
          console.log(`✅ A* path found: ${path.length} bodů, ${iterations} iterací, ${elapsed}ms`);
          return path;
        }

        for (const next of nodes[curr].neighbors) {
          const newCost = (cost.get(curr) || 0) + next.dist;
          if (!cost.has(next.idx) || newCost < cost.get(next.idx)) {
            cost.set(next.idx, newCost);
            const h = Math.hypot(nodes[next.idx].x - ex, nodes[next.idx].y - ey) * 1.2;
            pq.enqueue(next.idx, newCost + h);
            came.set(next.idx, curr);
          }
        }
      }
      
      const elapsed = Date.now() - startTime;
      console.log(`❌ A* cesta nenalezena po ${iterations} iteracích (${elapsed}ms)`);
      return null;
    }

    function findPathDijkstra(sx, sy, ex, ey) {
      const start = findNearestNode(sx, sy);
      const end = findNearestNode(ex, ey);
      if (start === -1 || end === -1) {
        console.log('❌ Dijkstra: Start nebo end node nenalezen');
        return null;
      }

      const startTime = Date.now();
      const MAX_ITERATIONS = 15000; // Dijkstra může potřebovat víc iterací
      const MAX_TIME = 3000; // 3 sekundy pro Dijkstra
      
      const came = new Map();
      const cost = new Map();
      const pq = new PriorityQueue();
      const visited = new Set();

      pq.enqueue(start, 0);
      cost.set(start, 0);
      
      let iterations = 0;

      while (!pq.isEmpty()) {
        iterations++;
        
        if (iterations % 100 === 0) {
          const elapsed = Date.now() - startTime;
          if (elapsed > MAX_TIME) {
            console.log(`⏱️ Dijkstra timeout after ${iterations} iterations (${elapsed}ms)`);
            return null;
          }
        }
        
        if (iterations > MAX_ITERATIONS) {
          console.log(`🔄 Dijkstra max iterations reached (${MAX_ITERATIONS})`);
          return null;
        }

        const curr = pq.dequeue().element;
        
        if (visited.has(curr)) continue;
        visited.add(curr);
        
        if (curr === end) {
          const path = [nodes[curr]];
          let c = curr;
          while (came.has(c)) {
            c = came.get(c);
            path.unshift(nodes[c]);
          }
          const elapsed = Date.now() - startTime;
          console.log(`✅ Dijkstra path found: ${path.length} bodů, ${iterations} iterací, ${elapsed}ms`);
          return path;
        }

        for (const next of nodes[curr].neighbors) {
          if (visited.has(next.idx)) continue;
          
          const newCost = (cost.get(curr) || 0) + next.dist;
          if (!cost.has(next.idx) || newCost < cost.get(next.idx)) {
            cost.set(next.idx, newCost);
            pq.enqueue(next.idx, newCost); // Dijkstra používá jen skutečnou cenu, bez heuristiky
            came.set(next.idx, curr);
          }
        }
      }
      
      const elapsed = Date.now() - startTime;
      console.log(`❌ Dijkstra cesta nenalezena po ${iterations} iteracích (${elapsed}ms)`);
      return null;
    }

    function findPathBidirectional(sx, sy, ex, ey) {
      const start = findNearestNode(sx, sy);
      const end = findNearestNode(ex, ey);
      if (start === -1 || end === -1) {
        console.log('❌ Bidirectional: Start nebo end node nenalezen');
        return null;
      }

      const startTime = Date.now();
      const MAX_ITERATIONS = 8000;
      const MAX_TIME = 2500;
      
      // Dvě fronty - z obou stran
      const forwardPQ = new PriorityQueue();
      const backwardPQ = new PriorityQueue();
      
      const forwardCame = new Map();
      const backwardCame = new Map();
      const forwardCost = new Map();
      const backwardCost = new Map();
      const forwardVisited = new Set();
      const backwardVisited = new Set();
      
      forwardPQ.enqueue(start, 0);
      backwardPQ.enqueue(end, 0);
      forwardCost.set(start, 0);
      backwardCost.set(end, 0);
      
      let iterations = 0;
      let meetingPoint = -1;

      while (!forwardPQ.isEmpty() && !backwardPQ.isEmpty()) {
        iterations++;
        
        if (iterations % 100 === 0) {
          const elapsed = Date.now() - startTime;
          if (elapsed > MAX_TIME) {
            console.log(`⏱️ Bidirectional timeout after ${iterations} iterations (${elapsed}ms)`);
            return null;
          }
        }
        
        if (iterations > MAX_ITERATIONS) {
          console.log(`🔄 Bidirectional max iterations reached (${MAX_ITERATIONS})`);
          return null;
        }

        // Forward search
        if (!forwardPQ.isEmpty()) {
          const curr = forwardPQ.dequeue().element;
          
          if (forwardVisited.has(curr)) continue;
          forwardVisited.add(curr);
          
          // Check if we met backward search
          if (backwardVisited.has(curr)) {
            meetingPoint = curr;
            break;
          }
          
          for (const next of nodes[curr].neighbors) {
            if (forwardVisited.has(next.idx)) continue;
            
            const newCost = (forwardCost.get(curr) || 0) + next.dist;
            if (!forwardCost.has(next.idx) || newCost < forwardCost.get(next.idx)) {
              forwardCost.set(next.idx, newCost);
              const h = Math.hypot(nodes[next.idx].x - ex, nodes[next.idx].y - ey);
              forwardPQ.enqueue(next.idx, newCost + h);
              forwardCame.set(next.idx, curr);
            }
          }
        }
        
        // Backward search
        if (!backwardPQ.isEmpty()) {
          const curr = backwardPQ.dequeue().element;
          
          if (backwardVisited.has(curr)) continue;
          backwardVisited.add(curr);
          
          // Check if we met forward search
          if (forwardVisited.has(curr)) {
            meetingPoint = curr;
            break;
          }
          
          for (const next of nodes[curr].neighbors) {
            if (backwardVisited.has(next.idx)) continue;
            
            const newCost = (backwardCost.get(curr) || 0) + next.dist;
            if (!backwardCost.has(next.idx) || newCost < backwardCost.get(next.idx)) {
              backwardCost.set(next.idx, newCost);
              const h = Math.hypot(nodes[next.idx].x - sx, nodes[next.idx].y - sy);
              backwardPQ.enqueue(next.idx, newCost + h);
              backwardCame.set(next.idx, curr);
            }
          }
        }
      }
      
      if (meetingPoint === -1) {
        const elapsed = Date.now() - startTime;
        console.log(`❌ Bidirectional cesta nenalezena po ${iterations} iteracích (${elapsed}ms)`);
        return null;
      }
      
      // Reconstruct path from both sides
      const forwardPath = [];
      let c = meetingPoint;
      while (c !== undefined) {
        forwardPath.unshift(nodes[c]);
        c = forwardCame.get(c);
      }
      
      const backwardPath = [];
      c = backwardCame.get(meetingPoint);
      while (c !== undefined) {
        backwardPath.push(nodes[c]);
        c = backwardCame.get(c);
      }
      
      const path = [...forwardPath, ...backwardPath];
      const elapsed = Date.now() - startTime;
      console.log(`✅ Bidirectional path found: ${path.length} bodů, ${iterations} iterací, ${elapsed}ms`);
      return path;
    }

    function findPathGreedy(sx, sy, ex, ey) {
      const start = findNearestNode(sx, sy);
      const end = findNearestNode(ex, ey);
      if (start === -1 || end === -1) {
        console.log('❌ Greedy: Start nebo end node nenalezen');
        return null;
      }

      const startTime = Date.now();
      const MAX_ITERATIONS = 5000; // Greedy je rychlejší ale může selhat
      const MAX_TIME = 1500;
      
      const came = new Map();
      const pq = new PriorityQueue();
      const visited = new Set();

      pq.enqueue(start, 0);
      
      let iterations = 0;

      while (!pq.isEmpty()) {
        iterations++;
        
        if (iterations % 100 === 0) {
          const elapsed = Date.now() - startTime;
          if (elapsed > MAX_TIME) {
            console.log(`⏱️ Greedy timeout after ${iterations} iterations (${elapsed}ms)`);
            return null;
          }
        }
        
        if (iterations > MAX_ITERATIONS) {
          console.log(`🔄 Greedy max iterations reached (${MAX_ITERATIONS})`);
          return null;
        }

        const curr = pq.dequeue().element;
        
        if (visited.has(curr)) continue;
        visited.add(curr);
        
        if (curr === end) {
          const path = [nodes[curr]];
          let c = curr;
          while (came.has(c)) {
            c = came.get(c);
            path.unshift(nodes[c]);
          }
          const elapsed = Date.now() - startTime;
          console.log(`✅ Greedy path found: ${path.length} bodů, ${iterations} iterací, ${elapsed}ms`);
          return path;
        }

        for (const next of nodes[curr].neighbors) {
          if (visited.has(next.idx)) continue;
          
          if (!came.has(next.idx)) {
            // Greedy používá JEN heuristiku (vzdušná vzdálenost k cíli)
            const h = Math.hypot(nodes[next.idx].x - ex, nodes[next.idx].y - ey);
            pq.enqueue(next.idx, h);
            came.set(next.idx, curr);
          }
        }
      }
      
      const elapsed = Date.now() - startTime;
      console.log(`❌ Greedy cesta nenalezena po ${iterations} iteracích (${elapsed}ms)`);
      return null;
    }

    function detectTurn(path) {
      try {
        if (!path || path.length < 5) return null;
        
        // Projdi celou cestu a najdi VŠECHNY zatáčky
        const turns = [];
        
        // Předpočítej kumulativní vzdálenosti pro všechny body
        const distances = [0];
        for (let i = 1; i < path.length; i++) {
          distances[i] = distances[i-1] + Math.hypot(path[i].x - path[i-1].x, path[i].y - path[i-1].y);
        }
        
        for (let i = 5; i < path.length - 5; i++) {
          const cumulativeDist = distances[i];
          
          // Skip body blíž než 20m (ty už pravděpodobně projedeš)
          if (cumulativeDist < 20) continue;
          
          // Skip body dál než 200m (příliš daleko na hlášení)
          if (cumulativeDist > 200) break;
          
          // Spočítej směr PŘED tímto bodem (5 bodů zpět)
          let beforeAngle = 0;
          let beforeCount = 0;
          for (let j = i - 5; j < i; j++) {
            const dx = path[j+1].x - path[j].x;
            const dy = path[j+1].y - path[j].y;
            const d = Math.hypot(dx, dy);
            if (d > 1) {
              beforeAngle += Math.atan2(dy, dx);
              beforeCount++;
            }
          }
          if (beforeCount === 0) continue;
          beforeAngle /= beforeCount;
          
          // Spočítej směr PO tomto bodu (5 bodů vpřed)
          let afterAngle = 0;
          let afterCount = 0;
          for (let j = i; j < Math.min(i + 5, path.length - 1); j++) {
            const dx = path[j+1].x - path[j].x;
            const dy = path[j+1].y - path[j].y;
            const d = Math.hypot(dx, dy);
            if (d > 1) {
              afterAngle += Math.atan2(dy, dx);
              afterCount++;
            }
          }
          if (afterCount === 0) continue;
          afterAngle /= afterCount;
          
          // Vypočti rozdíl úhlů
          let angleDiff = afterAngle - beforeAngle;
          while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
          while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
          
          const angleDeg = Math.abs(angleDiff * 180 / Math.PI);
          
          // Je to výrazná zatáčka? (alespoň 35°)
          if (angleDeg >= 35) {
            const isLeft = angleDiff > 0;
            let turnType;
            
            if (angleDeg < 60) {
              turnType = isLeft ? 'slight_left' : 'slight_right';
            } else if (angleDeg < 110) {
              turnType = isLeft ? 'left' : 'right';
            } else {
              turnType = isLeft ? 'sharp_left' : 'sharp_right';
            }
            
            turns.push({
              type: turnType,
              dist: cumulativeDist,
              angle: angleDeg,
              point: path[i],
              index: i
            });
          }
        }
        
        // Pokud nejsou žádné zatáčky, vrať null
        if (turns.length === 0) {
          console.log('⚠️ Žádné zatáčky nenalezeny v rozsahu 20-200m');
          return null;
        }
        
        // Debug výpis VŠECH zatáček
        console.log(`📋 Detekováno ${turns.length} zatáček:`);
        turns.slice(0, 5).forEach((t, idx) => {
          console.log(`  ${idx + 1}. ${t.type} at ${t.dist.toFixed(0)}m (${t.angle.toFixed(1)}°, idx: ${t.index})`);
        });
        if (turns.length > 5) console.log(`  ... a dalších ${turns.length - 5} zatáček`);
        
        // DETEKCE KRUHOVÉHO OBJEZDU
        // Pokud je víc než 2 zatáčky stejného směru blízko za sebou (do 100m), je to kruhový objezd
        let isRoundabout = false;
        if (turns.length >= 3) {
          const firstThree = turns.slice(0, 3);
          const allLeft = firstThree.every(t => t.type.includes('left'));
          const allRight = firstThree.every(t => t.type.includes('right'));
          const closeTogeter = (firstThree[2].dist - firstThree[0].dist) < 100;
          
          if ((allLeft || allRight) && closeTogeter) {
            isRoundabout = true;
            console.log(`🔄 ROUNDABOUT DETECTED: ${turns.length} turns in ${firstThree[2].dist.toFixed(0)}m`);
          }
        }
        
        // Vrať NEJBLIŽŠÍ zatáčku (první v pořadí)
        const nearestTurn = turns[0];
        nearestTurn.isRoundabout = isRoundabout;
        console.log(`🔄 NEAREST TURN: ${nearestTurn.type} at ${nearestTurn.dist.toFixed(0)}m (${nearestTurn.angle.toFixed(1)}°) [${turns.length} total turns found]${isRoundabout ? ' - ROUNDABOUT' : ''}`);
        
        return nearestTurn;
      } catch (error) {
        console.error('❌ TURN DETECTION ERROR:', error);
        console.log('🔍 Path data:', JSON.stringify({
          pathLength: path?.length,
          firstPoints: path?.slice(0, 5),
          lastPoints: path?.slice(-5)
        }, null, 2));

      }
    }

                const currentTurnId = `${turn.type}_${turn.index}`;
                if (state.voice.lastTurnId === currentTurnId) {
                  console.log(`✅ Turn passed (${turn.dist.toFixed(0)}m), resetting voice state`);
                  state.voice.lastTurnId = null;
                  state.voice.lastTurnTime = 0;
                  state.voice.lastTurnStage = null;
                }
              }
              
              // Hlasová navigace - VYLEPŠENÝ SYSTÉM
              if (state.ui.soundEnabled) {
                const now = Date.now();
                const timeSince = now - state.voice.lastTurnTime;
                const d = Math.round(turn.dist);
                
                // Unikátní ID zatáčky (typ + index v cestě - NIE vzdálenost!)
                const turnId = `${turn.type}_${turn.index}`;
                
                // Speciální text pro kruhové objezdy
                let turnText;
                if (turn.isRoundabout) {
                  turnText = turn.type.includes('left') ? 'enter roundabout and turn left' : 'enter roundabout and turn right';
                } else {
                  turnText = {
                    'slight_left': 'turn slightly left',
                    'slight_right': 'turn slightly right', 
                    'left': 'turn left',
                    'right': 'turn right',
                    'sharp_left': 'turn sharp left',
                    'sharp_right': 'turn sharp right'
                  }[turn.type] || 'continue straight';
                }
                
                let shouldSpeak = false;
                let message = '';
                let stage = null;
                
                // Hlášení podle vzdálenosti - s kontrolou na duplicity
                // 1. První varování: 100-120m
                if (d >= 100 && d <= 120) {
                  stage = 'warn1';
                  if (state.voice.lastTurnId !== turnId || state.voice.lastTurnStage !== stage) {
                    if (timeSince > 8000) { // Minimální čas mezi hlášeními
                      shouldSpeak = true;
                      message = `In ${d} meters ${turnText}`;
                    }
                  }
                }
                // 2. Druhé varování: 60-80m
                else if (d >= 60 && d < 80) {
                  stage = 'warn2';
                  if (state.voice.lastTurnId !== turnId || state.voice.lastTurnStage !== stage) {
                    if (timeSince > 6000) {
                      shouldSpeak = true;
                      message = `In ${d} meters ${turnText}`;
                    }
                  }
                }
                // 3. Poslední varování: 30-50m
                else if (d >= 30 && d < 50) {
                  stage = 'final';
                  if (state.voice.lastTurnId !== turnId || state.voice.lastTurnStage !== stage) {
                    if (timeSince > 4000) {
                      shouldSpeak = true;
                      message = `${turnText.charAt(0).toUpperCase() + turnText.slice(1)}`;
                    }
                  }
                }
                
                if (shouldSpeak) {
                  console.log(`🔊 VOICE: "${message}" (dist: ${d}m, angle: ${turn.angle.toFixed(1)}°, id: ${turnId}, stage: ${stage})`);
                  speak(message);
                  state.voice.lastTurnId = turnId;
                  state.voice.lastTurnStage = stage;
                  state.voice.lastTurnTime = now;
                }
              }
            } else {
              // Není zatáčka - zobraz šipku rovně
              icon.textContent = '⬆️';
            }
          } else {
            // Žádná cesta - zobraz "navigating" ikonu
            document.getElementById('turnIcon').textContent = '🧭';
          }
        }
      }
    }

      // Cars
      state.cars.forEach(car => {
        const p = worldToCanvas(car.x, car.y, state.track.config, state.track.img.width, state.track.img.height);
        const isMe = car.plid === state.ui.following;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-car.heading * Math.PI / 180);

        if (isMe) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 100, -Math.PI * 0.75, -Math.PI * 0.25);
          ctx.fillStyle = 'rgba(74, 158, 255, 0.2)';
          ctx.fill();
        }

        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(8, 10);
        ctx.lineTo(0, 6);
        ctx.lineTo(-8, 10);
        ctx.closePath();
        ctx.fillStyle = isMe ? '#4a9eff' : '#fff';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#777';
        ctx.stroke();
        ctx.restore();

        // Name tag
        if (state.camera.zoom > 0.6) {
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          const segs = parseLFSColors(car.name);
          let w = 0;
          segs.forEach(s => w += ctx.measureText(s.text).width);
          
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.beginPath();
          ctx.roundRect(p.x - w/2 - 6, p.y - 30, w + 12, 18, 9);
          ctx.fill();
          
          let x = p.x - w/2;
          segs.forEach(s => {
            ctx.fillStyle = (s.color === '#fff' || s.color === '#ffffff') ? '#000' : s.color;
            ctx.fillText(s.text, x + ctx.measureText(s.text).width/2, p.y - 17);
            x += ctx.measureText(s.text).width;
          });
        }
      });

      ctx.restore();
      requestAnimationFrame(render);
    }

    // ===== SEARCH =====
    function search() {
      const val = document.getElementById('searchBox').value.toLowerCase();
      const cont = document.getElementById('searchResults');
      cont.innerHTML = '';
      
      if (val.length < 2) {
        cont.classList.remove('show');
        return;
      }

      const locs = Object.entries(TC_LOCATIONS)
        .filter(([n]) => n.toLowerCase().includes(val))
        .slice(0, 5);
      
      const plys = Array.from(state.cars.values())
        .filter(c => stripColors(c.name).toLowerCase().includes(val))
        .slice(0, 5);

      if (locs.length) {
        cont.innerHTML += `<div class="result-group"><div class="result-label">MÍSTA</div>`;
        locs.forEach(([n, d]) => {
          cont.innerHTML += `<div class="result-item" onclick="selectLocation('${n}')">
            <span class="result-icon">${d.icon}</span>
            <span class="result-name">${n}</span>
          </div>`;
        });
        cont.innerHTML += '</div>';
      }

      if (plys.length) {
        cont.innerHTML += `<div class="result-group"><div class="result-label">HRÁČI</div>`;
        plys.forEach(c => {
          cont.innerHTML += `<div class="result-item" onclick="followPlayer(${c.plid})">
            <span class="result-icon">👤</span>
            <span class="result-name">${lfsToHTML(c.name)}</span>
          </div>`;
        });
        cont.innerHTML += '</div>';
      }

      cont.classList.add('show');
    }

    function hideSearch() {
      document.getElementById('searchResults').classList.remove('show');
      document.getElementById('searchBox').value = '';
    }

    window.selectLocation = (name) => {
      const data = TC_LOCATIONS[name];
      if (data) setTarget(name, data, data.icon);
    };

    window.followPlayer = (plid) => {
      state.ui.following = plid;
      hideSearch();
    };

    // ===== PLAYER LIST =====
    function updatePlayerList() {
      document.getElementById('onlineCount').textContent = `${state.cars.size} online`;
      document.getElementById('playerCount').textContent = `${state.cars.size} HRÁČŮ`;
      
      const items = document.getElementById('playerItems');
      items.innerHTML = Array.from(state.cars.values())
        .map(c => `<div class="player-item" onclick="followPlayer(${c.plid})">${lfsToHTML(c.name)}</div>`)
        .join('');
    }

    // ===== UI CONTROLS =====
    document.getElementById('searchBox').addEventListener('input', search);
    document.getElementById('searchBox').addEventListener('focus', search);
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchBox') && !e.target.closest('#searchResults')) {
        hideSearch();
      }
    });

    document.getElementById('closeNav').addEventListener('click', stopNav);
    
    document.getElementById('zoomInBtn').addEventListener('click', () => zoom(1.2));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoom(0.8));
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.camera.zoom = 1;
      state.camera.x = canvas.width / 2 - state.track.img.width / 2;
      state.camera.y = canvas.height / 2 - state.track.img.height / 2;
      state.ui.following = null;
    });
    
    document.getElementById('gpsBtn').addEventListener('click', () => {
      state.ui.gpsEnabled = !state.ui.gpsEnabled;
      document.getElementById('gpsBtn').classList.toggle('active');
    });
    
    document.getElementById('soundBtn').addEventListener('click', () => {
      state.ui.soundEnabled = !state.ui.soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.textContent = state.ui.soundEnabled ? '🔊' : '🔇';
      if (state.ui.soundEnabled) speak('Sound Navigation is on.');
    });
    
    document.getElementById('playersBtn').addEventListener('click', () => {
      document.getElementById('playerList').classList.toggle('show');
    });
    
    // Přepínání pathfinding algoritmu
    const algorithms = ['astar', 'dijkstra', 'bidirectional', 'greedy'];
    const algorithmNames = {
      'astar': { short: 'A*', long: 'A* (rychlý, heuristický)' },
      'dijkstra': { short: 'DJ', long: 'Dijkstra (spolehlivý)' },
      'bidirectional': { short: 'BI', long: 'Bidirectional A* (obousměrný)' },
      'greedy': { short: 'GR', long: 'Greedy (nejrychlejší, může selhat)' }
    };
    let currentAlgoIndex = 0;
    
    document.getElementById('algoBtn').addEventListener('click', () => {
      currentAlgoIndex = (currentAlgoIndex + 1) % algorithms.length;
      const algo = algorithms[currentAlgoIndex];
      const btn = document.getElementById('algoBtn');
      
      btn.textContent = algorithmNames[algo].short;
      btn.title = algorithmNames[algo].long;
      
      // Pošli změnu do workeru
      worker.postMessage({ type: 'SET_ALGORITHM', payload: algo });
      
      // Přepočítej cestu pokud existuje target
      if (state.nav.target) {
        state.nav.path = null;
        requestPath();
      }
      
      console.log(`🔧 Přepnuto na ${algo} algoritmus`);
    });

    // Canvas controls
    // Canvas controls - Mouse events
    canvas.addEventListener('mousedown', (e) => {
      state.ui.dragging = true;
      state.ui.lastDrag = { x: e.clientX, y: e.clientY };
    });
    
    window.addEventListener('mouseup', () => {
      state.ui.dragging = false;
    });
    
    window.addEventListener('mousemove', (e) => {
      if (state.ui.dragging) {
        state.camera.x += e.clientX - state.ui.lastDrag.x;
        state.camera.y += e.clientY - state.ui.lastDrag.y;
        state.ui.lastDrag = { x: e.clientX, y: e.clientY };
      }
    });
    
    // Canvas controls - Touch events (mobile)
    let lastTouchDistance = 0;
    
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 1) {
        // Single touch - pan
        state.ui.dragging = true;
        state.ui.lastDrag = { 
          x: e.touches[0].clientX, 
          y: e.touches[0].clientY 
        };
      } else if (e.touches.length === 2) {
        // Two finger - prepare for pinch zoom
        state.ui.dragging = false;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        lastTouchDistance = Math.hypot(dx, dy);
      }
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      
      if (e.touches.length === 1 && state.ui.dragging) {
        // Single touch - pan
        const touch = e.touches[0];
        state.camera.x += touch.clientX - state.ui.lastDrag.x;
        state.camera.y += touch.clientY - state.ui.lastDrag.y;
        state.ui.lastDrag = { x: touch.clientX, y: touch.clientY };
      } else if (e.touches.length === 2) {
        // Two finger - pinch zoom
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const distance = Math.hypot(dx, dy);
        
        if (lastTouchDistance > 0) {
          const scale = distance / lastTouchDistance;
          const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          zoom(scale, centerX, centerY);
        }
        
        lastTouchDistance = distance;
      }
    }, { passive: false });
    
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      state.ui.dragging = false;
      lastTouchDistance = 0;
    }, { passive: false });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
    }, { passive: false });

    // ===== HELPERS =====
    function zoom(factor, mx, my) {
      const x = mx || canvas.width / 2;
      const y = my || canvas.height / 2;
      const wx = (x - state.camera.x) / state.camera.zoom;
      const wy = (y - state.camera.y) / state.camera.zoom;
      const nz = Math.max(0.1, Math.min(state.camera.zoom * factor, 10));
      state.camera.x = x - wx * nz;
      state.camera.y = y - wy * nz;
      state.camera.zoom = nz;
    }

    function loadTrack(code) {
      const s = code.substring(0, 2);
      state.track.config = getTrackConfig(s);
      const img = new Image();
      img.src = `tracks/track_${s}.png`;
      img.onload = () => {
        state.track.img = img;
        document.getElementById('loader').classList.remove('show');
      };
    }

    function calcPathDistance(path) {
      let d = 0;
      for (let i = 0; i < path.length - 1; i++) {
        d += Math.hypot(path[i].x - path[i+1].x, path[i].y - path[i+1].y);
      }
      return d;
    }

    function formatTime(m) {
      if (m < 1) return '1 min';
      if (m >= 60) {
        const h = Math.floor(m / 60);
        const r = Math.round(m % 60);
        return `${h} h ${r} min`;
      }
      return `${Math.round(m)} min`;
    }

    function formatDist(d) {
      return d > 1000 ? `${(d/1000).toFixed(1)} km` : `${Math.round(d)} m`;
    }

    function getArrival(m) {
      const n = new Date();
      const f = new Date(n.getTime() + m * 60000);
      return f.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function parseLFSColors(t) {
      if (!t) return [{ text: '', color: '#000' }];
      const s = [];
      let c = '#000', curr = '';
      for (let i = 0; i < t.length; i++) {
        if (t[i] === '^' && i + 1 < t.length) {
          const k = t[i + 1].toLowerCase();
          if (LFS_COLORS[k]) {
            if (curr) s.push({ text: curr, color: c });
            c = LFS_COLORS[k];
            curr = '';
            i++;
            continue;
          }
          if (['l', 'g', 'c', 'j', 'e', 't', 'b', 'h', 's', 'k'].includes(k)) {
            i++;
            continue;
          }
        }
        curr += t[i];
      }
      if (curr) s.push({ text: curr, color: c });
      return s;
    }

    function lfsToHTML(t) {
      return parseLFSColors(t).map(s => `<span style="color:${s.color}">${s.text}</span>`).join('');
    }

    function stripColors(t) {
      return t ? t.replace(/\^[0-9a-zA-Z]/g, '') : '';
    }

    // ===== ERROR HANDLING & DEBUG LOGGING =====
    // Global error handler - automaticky loguje JSON debug info
    window.addEventListener('error', (event) => {
      console.error('❌ RUNTIME ERROR:', event.error);
      
      // Loguj stav aplikace
      const debugInfo = {
        error: {
          message: event.error?.message,
          stack: event.error?.stack
        },
        state: {
          hasPath: !!state.nav.path,
          pathLength: state.nav.path?.length || 0,
          hasTarget: !!state.nav.target,
          targetName: state.nav.target?.name,
          following: state.ui.following,
          carsCount: state.cars.size
        },
        timestamp: new Date().toISOString()
      };
      
      console.log('🔍 DEBUG INFO:', JSON.stringify(debugInfo, null, 2));
    });

    // ===== PREVENT DOUBLE-TAP ZOOM (iOS) =====
    let lastTapTime = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        e.preventDefault(); // Prevent double-tap zoom
      }
      lastTapTime = now;
    }, { passive: false });

    // ===== START =====
    loadTrack('BL1');
    render();
  </script>
</body>
</html>
