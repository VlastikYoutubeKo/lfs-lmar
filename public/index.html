<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFS Maps Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
    }
    
    #map { 
      position: fixed; 
      inset: 0; 
      background: #1a1a1a;
    }
    
    canvas { 
      display: block; 
      width: 100%; 
      height: 100%; 
    }
    
    /* ===== NAVIGATION BAR ===== */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      z-index: 1000;
    }
    
    #navbar h1 {
      font-size: 20px;
      font-weight: 600;
      color: #4a9eff;
    }
    
    #searchBox {
      flex: 1;
      max-width: 500px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 0 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    
    #searchBox:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: #4a9eff;
    }
    
    #searchResults {
      position: absolute;
      top: 65px;
      left: 20px;
      width: 500px;
      max-height: 400px;
      background: rgba(20, 20, 20, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow-y: auto;
      display: none;
    }
    
    #searchResults.show { display: block; }
    
    .result-group {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .result-group:last-child { border: none; }
    
    .result-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    
    .result-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    
    .result-item:hover {
      background: rgba(74, 158, 255, 0.15);
    }
    
    .result-icon {
      font-size: 20px;
      width: 30px;
      text-align: center;
    }
    
    .result-name {
      flex: 1;
      font-size: 14px;
    }
    
    /* ===== HUD (NAVIGATION) ===== */
    #hud {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 24px;
      display: none;
      flex-direction: row;
      align-items: center;
      gap: 20px;
      min-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    
    #hud.active { display: flex; }
    
    #turnIcon {
      font-size: 48px;
      width: 60px;
      text-align: center;
    }
    
    #hudInfo {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    #timeRow {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    
    #timeEta {
      font-size: 32px;
      font-weight: 700;
      color: #4a9eff;
    }
    
    #distance {
      font-size: 18px;
      color: #888;
    }
    
    #metaRow {
      display: flex;
      gap: 12px;
      font-size: 14px;
      color: #aaa;
    }
    
    #arrival { font-weight: 600; }
    
    #targetName {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    #closeNav {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    
    #closeNav:hover {
      background: rgba(255, 70, 70, 0.2);
      color: #ff4646;
    }
    
    /* ===== CONTROLS ===== */
    #controls {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }
    
    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: grid;
      place-items: center;
    }
    
    .control-btn:hover {
      background: rgba(74, 158, 255, 0.2);
      border-color: #4a9eff;
      transform: scale(1.1);
    }
    
    .control-btn.active {
      background: #4a9eff;
      color: #000;
    }
    
    /* ===== PLAYER LIST ===== */
    #playerList {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 250px;
      max-height: 400px;
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: none;
    }
    
    #playerList.show { display: block; }
    
    #playerCount {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    
    .player-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    
    .player-item:hover {
      background: rgba(74, 158, 255, 0.15);
    }
    
    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(74, 158, 255, 0.95);
      color: #000;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      z-index: 2000;
    }
    
    #loader.show { display: block; }
  </style>
</head>
<body>
  <!-- MAP -->
  <div id="map">
    <canvas id="canvas"></canvas>
  </div>
  
  <!-- NAVBAR -->
  <div id="navbar">
    <h1>🏁 LFS Maps</h1>
    <input type="text" id="searchBox" placeholder="Hledat místa nebo hráče..." />
    <div style="flex: 1;"></div>
    <div id="onlineCount" style="font-size: 13px; color: #888;">0 online</div>
  </div>
  
  <!-- SEARCH RESULTS -->
  <div id="searchResults"></div>
  
  <!-- HUD (Navigation) -->
  <div id="hud">
    <div id="turnIcon">⬆️</div>
    <div id="hudInfo">
      <div id="timeRow">
        <div id="timeEta">-- min</div>
        <div id="distance">-- km</div>
      </div>
      <div id="metaRow">
        <span id="arrival">--:--</span>
        <span>•</span>
        <span id="targetName">Cíl</span>
      </div>
    </div>
    <button id="closeNav">✕</button>
  </div>
  
  <!-- CONTROLS -->
  <div id="controls">
    <button class="control-btn" id="zoomInBtn">+</button>
    <button class="control-btn" id="zoomOutBtn">−</button>
    <button class="control-btn" id="resetBtn">⌂</button>
    <button class="control-btn active" id="gpsBtn">📍</button>
    <button class="control-btn" id="soundBtn">🔇</button>
    <button class="control-btn" id="playersBtn">👥</button>
  </div>
  
  <!-- PLAYER LIST -->
  <div id="playerList">
    <div id="playerCount">0 HRÁČŮ</div>
    <div id="playerItems"></div>
  </div>
  
  <!-- LOADER -->
  <div id="loader">Načítám navigační graf...</div>

  <!-- WORKER CODE -->
  <script id="worker-code" type="javascript/worker">
    class PriorityQueue {
      constructor() { this.items = []; }
      enqueue(element, priority) {
        const qElement = { element, priority };
        let added = false;
        for (let i = 0; i < this.items.length; i++) {
          if (this.items[i].priority > qElement.priority) {
            this.items.splice(i, 0, qElement);
            added = true;
            break;
          }
        }
        if (!added) this.items.push(qElement);
      }
      dequeue() { return this.items.shift(); }
      isEmpty() { return this.items.length === 0; }
    }

    let nodes = [];
    let graphReady = false;

    self.onmessage = function(e) {
      const { type, payload } = e.data;
      
      if (type === 'BUILD_GRAPH') {
        buildGraph(payload);
        self.postMessage({ type: 'GRAPH_READY' });
      } 
      else if (type === 'FIND_PATH') {
        if (!graphReady) return;
        const { startX, startY, endX, endY } = payload;
        const path = findPath(startX, startY, endX, endY);
        self.postMessage({ type: 'PATH_FOUND', payload: path });
      }
    };

    function buildGraph(locations) {
      const nodeMap = new Map();
      const roadSegments = [];
      
      Object.values(locations).forEach(loc => {
        if (loc.points && loc.points.length > 1) {
          roadSegments.push(loc.points);
        }
      });

      const getNode = (x, y) => {
        const key = `${Math.round(x * 10)},${Math.round(y * 10)}`;
        if (nodeMap.has(key)) return nodeMap.get(key);
        const idx = nodes.length;
        nodes.push({ x, y, neighbors: [] });
        nodeMap.set(key, idx);
        return idx;
      };

      // Build road connections
      roadSegments.forEach(pts => {
        for (let i = 0; i < pts.length - 1; i++) {
          const a = getNode(pts[i].x, pts[i].y);
          const b = getNode(pts[i + 1].x, pts[i + 1].y);
          const d = Math.hypot(pts[i].x - pts[i + 1].x, pts[i].y - pts[i + 1].y);
          nodes[a].neighbors.push({ idx: b, dist: d });
          nodes[b].neighbors.push({ idx: a, dist: d });
        }
      });

      // Build spatial grid for intersection connections
      const grid = new Map();
      const CELL = 25;
      nodes.forEach((node, idx) => {
        const k = `${Math.floor(node.x / CELL)},${Math.floor(node.y / CELL)}`;
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(idx);
      });

      // Connect nearby nodes (intersections)
      const MAX_DIST = 22;
      nodes.forEach((nodeA, idxA) => {
        const cx = Math.floor(nodeA.x / CELL);
        const cy = Math.floor(nodeA.y / CELL);
        
        for (let x = cx - 1; x <= cx + 1; x++) {
          for (let y = cy - 1; y <= cy + 1; y++) {
            const k = `${x},${y}`;
            if (!grid.has(k)) continue;
            
            grid.get(k).forEach(idxB => {
              if (idxA >= idxB) return;
              if (nodeA.neighbors.some(n => n.idx === idxB)) return;
              
              const nodeB = nodes[idxB];
              const d = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y);
              
              if (d < MAX_DIST) {
                nodes[idxA].neighbors.push({ idx: idxB, dist: d * 3 });
                nodes[idxB].neighbors.push({ idx: idxA, dist: d * 3 });
              }
            });
          }
        }
      });
      
      graphReady = true;
    }

    function findNearestNode(x, y) {
      let best = -1;
      let minD = Infinity;
      for (let i = 0; i < nodes.length; i++) {
        const d = (nodes[i].x - x) ** 2 + (nodes[i].y - y) ** 2;
        if (d < minD) { minD = d; best = i; }
      }
      return (minD < 100000) ? best : -1;
    }

    function findPath(sx, sy, ex, ey) {
      const start = findNearestNode(sx, sy);
      const end = findNearestNode(ex, ey);
      if (start === -1 || end === -1) return null;

      const came = new Map();
      const cost = new Map();
      const pq = new PriorityQueue();

      pq.enqueue(start, 0);
      cost.set(start, 0);

      while (!pq.isEmpty()) {
        const curr = pq.dequeue().element;
        if (curr === end) {
          const path = [nodes[curr]];
          let c = curr;
          while (came.has(c)) {
            c = came.get(c);
            path.unshift(nodes[c]);
          }
          return path;
        }

        for (const next of nodes[curr].neighbors) {
          const newCost = (cost.get(curr) || 0) + next.dist;
          if (!cost.has(next.idx) || newCost < cost.get(next.idx)) {
            cost.set(next.idx, newCost);
            const h = Math.hypot(nodes[next.idx].x - ex, nodes[next.idx].y - ey);
            pq.enqueue(next.idx, newCost + h);
            came.set(next.idx, curr);
          }
        }
      }
      return null;
    }
  </script>

  <script type="module">
    import { getTrackConfig, worldToCanvas } from './track_configs.js';
    import { TC_LOCATIONS } from './tc_locations.js';

    // ===== GLOBALS =====
    const LFS_COLORS = {
      '0': '#000', '1': '#f03e3e', '2': '#40c057', '3': '#fcc419',
      '4': '#228be6', '5': '#da77f2', '6': '#15aabf', '7': '#fff',
      '8': '#fd7e14', '9': '#868e96'
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const state = {
      cars: new Map(),
      camera: { x: 0, y: 0, zoom: 1 },
      track: { config: getTrackConfig('BL'), img: new Image() },
      nav: { target: null, path: null, distance: 0 },
      ui: { following: null, dragging: false, lastDrag: { x: 0, y: 0 }, gpsEnabled: true, soundEnabled: false },
      voice: { lastTurn: null, lastTurnTime: 0, avgSpeed: 0 }
    };

    // ===== WORKER =====
    const blob = new Blob([document.getElementById('worker-code').textContent], { type: 'text/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));
    let workerBusy = false;

    document.getElementById('loader').classList.add('show');
    worker.postMessage({ type: 'BUILD_GRAPH', payload: TC_LOCATIONS });

    worker.onmessage = (e) => {
      if (e.data.type === 'GRAPH_READY') {
        document.getElementById('loader').classList.remove('show');
      }
      else if (e.data.type === 'PATH_FOUND') {
        workerBusy = false;
        if (e.data.payload && e.data.payload.length > 1) {
          state.nav.path = e.data.payload;
          state.nav.distance = calcPathDistance(e.data.payload);
        }
      }
    };

    // ===== WEBSOCKET =====
    const ws = new WebSocket(`ws://${window.location.host}`);
    
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      
      if (data.type === 'track') {
        loadTrack(data.track);
      }
      else if (data.type === 'positions') {
        const valid = new Set();
        data.cars.forEach(c => {
          state.cars.set(c.plid, c);
          valid.add(c.plid);
        });
        for (let k of state.cars.keys()) {
          if (!valid.has(k)) state.cars.delete(k);
        }
        updatePlayerList();
      }
    };

    // ===== NAVIGATION =====
    function setTarget(name, coords, icon) {
      state.nav.target = { name, x: coords.x, y: coords.y, icon, points: coords.points || null };
      state.nav.path = null;
      state.voice.lastTurn = null;
      requestPath();
      hideSearch();
    }

    function requestPath() {
      if (!state.nav.target || !state.ui.following || workerBusy) return;
      const me = state.cars.get(state.ui.following);
      if (!me) return;

      let tx = state.nav.target.x;
      let ty = state.nav.target.y;

      // Snap to road if possible
      if (state.nav.target.points && state.nav.target.points.length > 0) {
        let minD = Infinity;
        let best = null;
        for (const pt of state.nav.target.points) {
          const d = Math.hypot(pt.x - tx, pt.y - ty);
          if (d < minD) { minD = d; best = pt; }
        }
        if (best && minD < 50) {
          tx = best.x;
          ty = best.y;
        }
      }

      workerBusy = true;
      worker.postMessage({
        type: 'FIND_PATH',
        payload: { startX: me.x, startY: me.y, endX: tx, endY: ty }
      });
    }

    setInterval(requestPath, 1000);

    function stopNav() {
      state.nav.target = null;
      state.nav.path = null;
      document.getElementById('hud').classList.remove('active');
    }

    // ===== TURN DETECTION =====
    function detectTurn(path) {
      if (!path || path.length < 10) return null;

      const WIN = 4; // Větší okno = stabilnější detekce
      
      for (let i = WIN; i < Math.min(path.length - WIN - 1, 40); i++) {
        let dist = 0;
        for (let j = 1; j <= i; j++) {
          dist += Math.hypot(path[j].x - path[j-1].x, path[j].y - path[j-1].y);
        }
        
        if (dist > 150) break;
        if (dist < 50) continue;
        
        let before = 0, after = 0, cntB = 0, cntA = 0;
        
        // Průměrný směr PŘED odbočkou
        for (let j = Math.max(1, i - WIN); j < i; j++) {
          const dx = path[j].x - path[j-1].x;
          const dy = path[j].y - path[j-1].y;
          const d = Math.hypot(dx, dy);
          if (d > 5) { before += Math.atan2(dy, dx); cntB++; }
        }
        
        // Průměrný směr PO odbočce
        for (let j = i; j < Math.min(i + WIN, path.length - 1); j++) {
          const dx = path[j+1].x - path[j].x;
          const dy = path[j+1].y - path[j].y;
          const d = Math.hypot(dx, dy);
          if (d > 5) { after += Math.atan2(dy, dx); cntA++; }
        }
        
        if (cntB === 0 || cntA === 0) continue;
        
        before /= cntB;
        after /= cntA;
        
        let diff = after - before;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        
        const deg = Math.abs(diff * 180 / Math.PI);
        
        // PŘÍSNĚJŠÍ: 60° místo 50° (méně false positives)
        if (deg > 60) {
          // Určit typ odbočky podle úhlu
          let turnType;
          if (deg < 100) {
            // Mírná odbočka (60-100°)
            turnType = diff > 0 ? 'slight_left' : 'slight_right';
          } else {
            // Ostrá odbočka (100°+)
            turnType = diff > 0 ? 'left' : 'right';
          }
          
          return { type: turnType, dist, angle: deg };
        }
      }
      return null;
    }

    // ===== VOICE =====
    function speak(text) {
      if (!state.ui.soundEnabled || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'cs-CZ';
      u.rate = 1.1;
      window.speechSynthesis.speak(u);
    }

    // ===== RENDER =====
    function render() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Camera follow
      if (state.ui.following !== null && !state.ui.dragging) {
        const car = state.cars.get(state.ui.following);
        if (car) {
          const p = worldToCanvas(car.x, car.y, state.track.config, state.track.img.width, state.track.img.height);
          state.camera.x = canvas.width / 2 - p.x * state.camera.zoom;
          state.camera.y = canvas.height / 2 - p.y * state.camera.zoom;
        }
      }

      ctx.save();
      ctx.translate(state.camera.x, state.camera.y);
      ctx.scale(state.camera.zoom, state.camera.zoom);

      // Track
      if (state.track.img.complete) {
        ctx.drawImage(state.track.img, 0, 0);
      }

      // Path
      if (state.ui.gpsEnabled && state.nav.path && state.nav.path.length > 1) {
        const me = state.cars.get(state.ui.following);
        
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        
        if (me) {
          const sp = worldToCanvas(me.x, me.y, state.track.config, state.track.img.width, state.track.img.height);
          ctx.moveTo(sp.x, sp.y);
        }
        
        state.nav.path.forEach((pt, i) => {
          const p = worldToCanvas(pt.x, pt.y, state.track.config, state.track.img.width, state.track.img.height);
          if (i === 0 && !me) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        
        ctx.lineWidth = 14;
        ctx.strokeStyle = 'rgba(74, 158, 255, 0.4)';
        ctx.stroke();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#4a9eff';
        ctx.stroke();

        // Destination marker
        if (state.nav.target) {
          const tp = worldToCanvas(state.nav.target.x, state.nav.target.y, state.track.config, state.track.img.width, state.track.img.height);
          const pulse = 8 + Math.sin(Date.now() / 300) * 4;
          
          ctx.fillStyle = 'rgba(74, 158, 255, 0.2)';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, pulse + 20, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#4a9eff';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, 15, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, 8, 0, Math.PI * 2);
          ctx.fill();
          
          if (state.nav.target.icon) {
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(state.nav.target.icon, tp.x, tp.y - 40);
          }
        }

        // Update HUD
        if (me) {
          const dist = Math.hypot(me.x - state.nav.target.x, me.y - state.nav.target.y);
          
          if (dist < 25) {
            stopNav();
            if (state.ui.soundEnabled) speak('Jste v cíli');
          } else {
            state.voice.avgSpeed = state.voice.avgSpeed * 0.95 + me.speed * 0.05;
            const effSpeed = (state.voice.avgSpeed * 3.6 < 10) ? 13.8 : state.voice.avgSpeed;
            const timeMin = (state.nav.distance / effSpeed) / 60;

            document.getElementById('hud').classList.add('active');
            document.getElementById('timeEta').textContent = formatTime(timeMin);
            document.getElementById('distance').textContent = formatDist(state.nav.distance);
            document.getElementById('arrival').textContent = getArrival(timeMin);
            document.getElementById('targetName').textContent = stripColors(state.nav.target.name);

            // Turn detection & voice guidance (Google Maps style)
            const turn = detectTurn(state.nav.path);
            const icon = document.getElementById('turnIcon');
            
            if (turn) {
              // Ikony podle typu odbočky
              if (turn.type === 'slight_left') icon.textContent = '↖️';
              else if (turn.type === 'slight_right') icon.textContent = '↗️';
              else if (turn.type === 'left') icon.textContent = '⬅️';
              else if (turn.type === 'right') icon.textContent = '➡️';
              
              // GOOGLE MAPS STYL - Více hlášení podle vzdálenosti
              if (state.ui.soundEnabled) {
                const now = Date.now();
                const timeSinceLastAnnouncement = now - state.voice.lastTurnTime;
                
                // Určit co říct podle vzdálenosti
                let shouldSpeak = false;
                let message = '';
                
                const d = Math.round(turn.dist);
                const turnText = {
                  'slight_left': 'mírně vlevo',
                  'slight_right': 'mírně vpravo',
                  'left': 'vlevo',
                  'right': 'vpravo'
                }[turn.type];
                
                // 1. Předběžné varování (120-150m)
                if (d >= 120 && d <= 150 && (!state.voice.lastTurn || state.voice.lastTurn !== `pre_${turn.type}`)) {
                  shouldSpeak = true;
                  message = `Za ${d} metrů odbočte ${turnText}`;
                  state.voice.lastTurn = `pre_${turn.type}`;
                  state.voice.lastTurnTime = now;
                }
                // 2. Hlavní instrukce (80-100m)
                else if (d >= 80 && d < 100 && (!state.voice.lastTurn || !state.voice.lastTurn.startsWith('main')) && timeSinceLastAnnouncement > 8000) {
                  shouldSpeak = true;
                  message = `Za ${d} metrů odbočte ${turnText}`;
                  state.voice.lastTurn = `main_${turn.type}`;
                  state.voice.lastTurnTime = now;
                }
                // 3. Blízká instrukce (50-60m)
                else if (d >= 50 && d < 60 && (!state.voice.lastTurn || !state.voice.lastTurn.startsWith('near')) && timeSinceLastAnnouncement > 6000) {
                  shouldSpeak = true;
                  message = `Připravte se odbočit ${turnText}`;
                  state.voice.lastTurn = `near_${turn.type}`;
                  state.voice.lastTurnTime = now;
                }
                
                if (shouldSpeak) {
                  speak(message);
                }
              }
            } else {
              icon.textContent = '⬆️';
              // Reset když už není žádná odbočka blízko
              if (state.nav.distance > 200) {
                state.voice.lastTurn = null;
              }
            }
          }
        }
      } else {
        document.getElementById('hud').classList.remove('active');
      }

      // Cars
      state.cars.forEach(car => {
        const p = worldToCanvas(car.x, car.y, state.track.config, state.track.img.width, state.track.img.height);
        const isMe = car.plid === state.ui.following;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(-car.heading * Math.PI / 180);

        if (isMe) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 100, -Math.PI * 0.75, -Math.PI * 0.25);
          ctx.fillStyle = 'rgba(74, 158, 255, 0.2)';
          ctx.fill();
        }

        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(8, 10);
        ctx.lineTo(0, 6);
        ctx.lineTo(-8, 10);
        ctx.closePath();
        ctx.fillStyle = isMe ? '#4a9eff' : '#fff';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#777';
        ctx.stroke();
        ctx.restore();

        // Name tag
        if (state.camera.zoom > 0.6) {
          ctx.font = 'bold 11px sans-serif';
          ctx.textAlign = 'center';
          const segs = parseLFSColors(car.name);
          let w = 0;
          segs.forEach(s => w += ctx.measureText(s.text).width);
          
          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          ctx.beginPath();
          ctx.roundRect(p.x - w/2 - 6, p.y - 30, w + 12, 18, 9);
          ctx.fill();
          
          let x = p.x - w/2;
          segs.forEach(s => {
            ctx.fillStyle = (s.color === '#fff' || s.color === '#ffffff') ? '#000' : s.color;
            ctx.fillText(s.text, x + ctx.measureText(s.text).width/2, p.y - 17);
            x += ctx.measureText(s.text).width;
          });
        }
      });

      ctx.restore();
      requestAnimationFrame(render);
    }

    // ===== SEARCH =====
    function search() {
      const val = document.getElementById('searchBox').value.toLowerCase();
      const cont = document.getElementById('searchResults');
      cont.innerHTML = '';
      
      if (val.length < 2) {
        cont.classList.remove('show');
        return;
      }

      const locs = Object.entries(TC_LOCATIONS)
        .filter(([n]) => n.toLowerCase().includes(val))
        .slice(0, 5);
      
      const plys = Array.from(state.cars.values())
        .filter(c => stripColors(c.name).toLowerCase().includes(val))
        .slice(0, 5);

      if (locs.length) {
        cont.innerHTML += `<div class="result-group"><div class="result-label">MÍSTA</div>`;
        locs.forEach(([n, d]) => {
          cont.innerHTML += `<div class="result-item" onclick="selectLocation('${n}')">
            <span class="result-icon">${d.icon}</span>
            <span class="result-name">${n}</span>
          </div>`;
        });
        cont.innerHTML += '</div>';
      }

      if (plys.length) {
        cont.innerHTML += `<div class="result-group"><div class="result-label">HRÁČI</div>`;
        plys.forEach(c => {
          cont.innerHTML += `<div class="result-item" onclick="followPlayer(${c.plid})">
            <span class="result-icon">👤</span>
            <span class="result-name">${lfsToHTML(c.name)}</span>
          </div>`;
        });
        cont.innerHTML += '</div>';
      }

      cont.classList.add('show');
    }

    function hideSearch() {
      document.getElementById('searchResults').classList.remove('show');
      document.getElementById('searchBox').value = '';
    }

    window.selectLocation = (name) => {
      const data = TC_LOCATIONS[name];
      if (data) setTarget(name, data, data.icon);
    };

    window.followPlayer = (plid) => {
      state.ui.following = plid;
      hideSearch();
    };

    // ===== PLAYER LIST =====
    function updatePlayerList() {
      document.getElementById('onlineCount').textContent = `${state.cars.size} online`;
      document.getElementById('playerCount').textContent = `${state.cars.size} HRÁČŮ`;
      
      const items = document.getElementById('playerItems');
      items.innerHTML = Array.from(state.cars.values())
        .map(c => `<div class="player-item" onclick="followPlayer(${c.plid})">${lfsToHTML(c.name)}</div>`)
        .join('');
    }

    // ===== UI CONTROLS =====
    document.getElementById('searchBox').addEventListener('input', search);
    document.getElementById('searchBox').addEventListener('focus', search);
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchBox') && !e.target.closest('#searchResults')) {
        hideSearch();
      }
    });

    document.getElementById('closeNav').addEventListener('click', stopNav);
    
    document.getElementById('zoomInBtn').addEventListener('click', () => zoom(1.2));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoom(0.8));
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.camera.zoom = 1;
      state.camera.x = canvas.width / 2 - state.track.img.width / 2;
      state.camera.y = canvas.height / 2 - state.track.img.height / 2;
      state.ui.following = null;
    });
    
    document.getElementById('gpsBtn').addEventListener('click', () => {
      state.ui.gpsEnabled = !state.ui.gpsEnabled;
      document.getElementById('gpsBtn').classList.toggle('active');
    });
    
    document.getElementById('soundBtn').addEventListener('click', () => {
      state.ui.soundEnabled = !state.ui.soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.textContent = state.ui.soundEnabled ? '🔊' : '🔇';
      if (state.ui.soundEnabled) speak('Hlasová navigace zapnuta');
    });
    
    document.getElementById('playersBtn').addEventListener('click', () => {
      document.getElementById('playerList').classList.toggle('show');
    });

    // Canvas controls
    canvas.addEventListener('mousedown', (e) => {
      state.ui.dragging = true;
      state.ui.lastDrag = { x: e.clientX, y: e.clientY };
    });
    
    window.addEventListener('mouseup', () => {
      state.ui.dragging = false;
    });
    
    window.addEventListener('mousemove', (e) => {
      if (state.ui.dragging) {
        state.camera.x += e.clientX - state.ui.lastDrag.x;
        state.camera.y += e.clientY - state.ui.lastDrag.y;
        state.ui.lastDrag = { x: e.clientX, y: e.clientY };
      }
    });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
    }, { passive: false });

    // ===== HELPERS =====
    function zoom(factor, mx, my) {
      const x = mx || canvas.width / 2;
      const y = my || canvas.height / 2;
      const wx = (x - state.camera.x) / state.camera.zoom;
      const wy = (y - state.camera.y) / state.camera.zoom;
      const nz = Math.max(0.1, Math.min(state.camera.zoom * factor, 10));
      state.camera.x = x - wx * nz;
      state.camera.y = y - wy * nz;
      state.camera.zoom = nz;
    }

    function loadTrack(code) {
      const s = code.substring(0, 2);
      state.track.config = getTrackConfig(s);
      const img = new Image();
      img.src = `tracks/track_${s}.png`;
      img.onload = () => {
        state.track.img = img;
        document.getElementById('loader').classList.remove('show');
      };
    }

    function calcPathDistance(path) {
      let d = 0;
      for (let i = 0; i < path.length - 1; i++) {
        d += Math.hypot(path[i].x - path[i+1].x, path[i].y - path[i+1].y);
      }
      return d;
    }

    function formatTime(m) {
      if (m < 1) return '1 min';
      if (m >= 60) {
        const h = Math.floor(m / 60);
        const r = Math.round(m % 60);
        return `${h} h ${r} min`;
      }
      return `${Math.round(m)} min`;
    }

    function formatDist(d) {
      return d > 1000 ? `${(d/1000).toFixed(1)} km` : `${Math.round(d)} m`;
    }

    function getArrival(m) {
      const n = new Date();
      const f = new Date(n.getTime() + m * 60000);
      return f.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function parseLFSColors(t) {
      if (!t) return [{ text: '', color: '#000' }];
      const s = [];
      let c = '#000', curr = '';
      for (let i = 0; i < t.length; i++) {
        if (t[i] === '^' && i + 1 < t.length) {
          const k = t[i + 1].toLowerCase();
          if (LFS_COLORS[k]) {
            if (curr) s.push({ text: curr, color: c });
            c = LFS_COLORS[k];
            curr = '';
            i++;
            continue;
          }
          if (['l', 'g', 'c', 'j', 'e', 't', 'b', 'h', 's', 'k'].includes(k)) {
            i++;
            continue;
          }
        }
        curr += t[i];
      }
      if (curr) s.push({ text: curr, color: c });
      return s;
    }

    function lfsToHTML(t) {
      return parseLFSColors(t).map(s => `<span style="color:${s.color}">${s.text}</span>`).join('');
    }

    function stripColors(t) {
      return t ? t.replace(/\^[0-9a-zA-Z]/g, '') : '';
    }

    // ===== START =====
    loadTrack('BL1');
    render();
  </script>
</body>
</html>
