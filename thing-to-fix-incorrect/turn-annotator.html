<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFS Turn Annotator</title>
  <style>
    :root {
      --accent: #4a9eff;
      --accent-dim: rgba(74, 158, 255, 0.3);
      --bg-dark: #0a0a0a;
      --bg-panel: rgba(20, 20, 20, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --text: #fff;
      --text-dim: #888;
      --danger: #ff4444;
      --success: #44ff88;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    /* HEADER */
    header {
      grid-column: 1 / -1;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, .btn {
      background: #1a1a1a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    select option {
      background: #1a1a1a;
      color: #fff;
    }

    select:hover, .btn:hover {
      background: #252525;
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #6ab0ff;
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    /* LEFT SIDEBAR - Layers */
    .sidebar-left {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    /* Layer Items */
    .layer-item {
      background: rgba(255,255,255,0.03);
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .layer-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .layer-item.active {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .layer-item.hidden {
      opacity: 0.4;
    }

    .layer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .layer-name {
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    .layer-color {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .layer-actions {
      display: flex;
      gap: 4px;
    }

    .layer-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #aaa;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    .layer-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .layer-btn.danger:hover {
      background: var(--danger);
    }

    .layer-stats {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 12px;
    }

    /* MAIN CANVAS AREA */
    .canvas-area {
      position: relative;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .canvas-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-dim);
    }

    /* RIGHT SIDEBAR - Tools */
    .sidebar-right {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Turn Type Selector */
    .turn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px;
    }

    .turn-btn {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: #888;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .turn-btn small {
      font-size: 9px;
      color: var(--text-dim);
    }

    .turn-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: scale(1.05);
    }

    .turn-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .turn-btn.selected small {
      color: #000;
    }

    /* Alignment Controls */
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .control-row label {
      font-size: 12px;
      color: var(--text-dim);
    }

    .control-row span {
      font-size: 11px;
      color: var(--text);
      min-width: 40px;
      text-align: right;
    }

    input[type="range"] {
      flex: 1;
      margin: 0 10px;
      accent-color: var(--accent);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .checkbox-group {
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 8px;
    }

    .checkbox-group .checkbox-row:last-child {
      margin-bottom: 0;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
    }

    .control-row label {
      min-width: 40px;
    }

    .num-input {
      width: 60px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 11px;
      text-align: center;
    }

    .num-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Hide number input spinners */
    .num-input::-webkit-outer-spin-button,
    .num-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .num-input[type=number] {
      -moz-appearance: textfield;
    }

    /* Annotations List */
    .annotation-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      margin-bottom: 4px;
      border-left: 3px solid var(--accent);
      font-size: 12px;
    }

    .annotation-item button {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 2px 6px;
    }

    .annotation-item button:hover {
      color: var(--danger);
    }

    /* FOOTER */
    footer {
      grid-column: 1 / -1;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-stats {
      display: flex;
      gap: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .footer-stats b {
      color: var(--text);
    }

    .footer-actions {
      display: flex;
      gap: 10px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    /* Help text */
    .help-text {
      font-size: 10px;
      color: var(--text-dim);
      padding: 10px;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    input[type="file"] { display: none; }

    /* Responsive - collapse sidebars on small screens */
    @media (max-width: 1000px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr auto auto;
      }
      .sidebar-left, .sidebar-right {
        max-height: 200px;
        overflow-y: auto;
      }
      .sidebar-right {
        order: 2;
      }
      .canvas-area {
        order: 3;
        min-height: 400px;
      }
      footer {
        order: 4;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>📝</span>
      <span>Turn Annotator</span>
    </div>
    <div class="header-controls">
      <select id="trackSelect">
        <option value="">Select Track...</option>
        <option value="AS">Aston</option>
        <option value="AU">Autocross</option>
        <option value="BL">Blackwood</option>
        <option value="FE">Fern Bay</option>
        <option value="KY">Kyoto</option>
        <option value="LA">Layout</option>
        <option value="RO">Rockingham</option>
        <option value="SO">South City</option>
        <option value="WE">Westhill</option>
      </select>
      <label class="btn">
        <span>+ Add Trip</span>
        <input type="file" id="fileInput" accept=".json" multiple>
      </label>
      <button class="btn" onclick="showHelp()">?</button>
    </div>
  </header>

  <aside class="sidebar-left">
    <div class="panel-header">
      <span>Layers</span>
      <span id="layerCount">0</span>
    </div>
    <div class="panel-content" id="layerList">
      <div class="empty-state">
        Load trip recordings<br>using "+ Add Trip"
      </div>
    </div>
  </aside>

  <main class="canvas-area">
    <canvas id="canvas"></canvas>
    <div class="canvas-info" id="canvasInfo">Scroll to zoom, drag to pan</div>
  </main>

  <aside class="sidebar-right">
    <div class="panel-header">Turn Type</div>
    <div class="turn-grid">
      <button class="turn-btn" data-type="sharp_left">↩️<small>Q</small></button>
      <button class="turn-btn" data-type="left">⬅️<small>W</small></button>
      <button class="turn-btn" data-type="slight_left">↖️<small>E</small></button>
      <button class="turn-btn" data-type="sharp_right">↪️<small>A</small></button>
      <button class="turn-btn" data-type="right">➡️<small>S</small></button>
      <button class="turn-btn" data-type="slight_right">↗️<small>D</small></button>
    </div>

    <div class="panel-header" style="background: rgba(74, 158, 255, 0.1);">Alignment</div>
    <div class="panel-content" style="flex: none; padding-bottom: 10px; border-bottom: 1px solid var(--border);">
      <div class="control-row">
        <label>X</label>
        <input type="range" id="offsetX" min="-2000" max="2000" value="0">
        <input type="number" id="offsetXNum" class="num-input" value="0">
      </div>
      <div class="control-row">
        <label>Y</label>
        <input type="range" id="offsetY" min="-2000" max="2000" value="0">
        <input type="number" id="offsetYNum" class="num-input" value="0">
      </div>
      <div class="control-row">
        <label>Scale</label>
        <input type="range" id="scale" min="0.001" max="5" value="1" step="0.001">
        <input type="number" id="scaleNum" class="num-input" value="1" step="0.001">
      </div>
      <div class="control-row">
        <label>Rotate</label>
        <input type="range" id="rotation" min="-180" max="180" value="0" step="1">
        <input type="number" id="rotationNum" class="num-input" value="0">
      </div>
      <div class="checkbox-group">
        <label class="checkbox-row">
          <input type="checkbox" id="flipY" checked>
          Flip Y-axis
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="flipX">
          Flip X-axis
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="divideCoords">
          ÷65536 (raw LFS coords)
        </label>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 8px;">
        <button class="btn" onclick="resetAlignment()" style="flex: 1;">Reset</button>
        <button class="btn btn-primary" onclick="autoFitLayer()" style="flex: 1;">Auto Fit</button>
      </div>
    </div>

    <div class="panel-header">
      <span>Annotations</span>
      <span id="annCount">0</span>
    </div>
    <div class="panel-content" id="annList" style="flex: 1;">
      <div class="empty-state" style="padding: 20px;">No annotations yet</div>
    </div>

    <div class="help-text">
      <b>Keys:</b> Q/W/E = Left turns, A/S/D = Right turns<br>
      Click on path to add annotation
    </div>
  </aside>

  <footer>
    <div class="footer-stats">
      <span>Points: <b id="statPoints">0</b></span>
      <span>Annotations: <b id="statLabels">0</b></span>
      <span>Layers: <b id="statLayers">0</b></span>
    </div>
    <div class="footer-actions">
      <button class="btn btn-danger" onclick="clearAllAnnotations()">Clear All</button>
      <button class="btn btn-primary" onclick="exportDataset()">Export Dataset</button>
    </div>
  </footer>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Track configurations (same as main app)
    const TRACK_CONFIGS = {
      'AS': { bounds: { minX: -1280, maxX: 1280, minY: -1280, maxY: 1280 } },
      'AU': { bounds: { minX: -1280, maxX: 1280, minY: -1280, maxY: 1280 } },
      'BL': { bounds: { minX: -1280, maxX: 1280, minY: -1280, maxY: 1280 } },
      'FE': { bounds: { minX: -1024, maxX: 1024, minY: -1024, maxY: 1024 } },
      'KY': { bounds: { minX: -1792, maxX: 1792, minY: -1792, maxY: 1792 } },
      'LA': { bounds: { minX: -2048, maxX: 2048, minY: -2048, maxY: 2048 } },
      'RO': { bounds: { minX: -768, maxX: 768, minY: -768, maxY: 768 } },
      'SO': { bounds: { minX: -1792, maxX: 1792, minY: -1792, maxY: 1792 } },
      'WE': { bounds: { minX: -1536, maxX: 1536, minY: -1536, maxY: 1536 } }
    };

    const LAYER_COLORS = ['#4a9eff', '#22c55e', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#f97316', '#06b6d4'];

    const state = {
      layers: [],
      activeLayerIndex: null,
      selectedType: null,
      trackCode: null,
      trackImage: null,
      trackConfig: null,
      camera: { x: 0, y: 0, zoom: 1 },
      isDragging: false,
      lastMouse: { x: 0, y: 0 }
    };

    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    // Initialize
    function init() {
      resizeCanvas();
      setupEventListeners();
    }

    function setupEventListeners() {
      // Track selection
      document.getElementById('trackSelect').addEventListener('change', e => {
        loadTrack(e.target.value);
      });

      // File input
      document.getElementById('fileInput').addEventListener('change', handleFileInput);

      // Turn type buttons
      document.querySelectorAll('.turn-btn').forEach(btn => {
        btn.addEventListener('click', () => selectTurnType(btn.dataset.type));
      });

      // Alignment controls - range sliders
      ['offsetX', 'offsetY', 'scale', 'rotation'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
          document.getElementById(id + 'Num').value = e.target.value;
          handleAlignmentChange();
        });
      });

      // Alignment controls - number inputs
      ['offsetXNum', 'offsetYNum', 'scaleNum', 'rotationNum'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
          const sliderId = id.replace('Num', '');
          document.getElementById(sliderId).value = e.target.value;
          handleAlignmentChange();
        });
      });

      // Checkboxes
      document.getElementById('flipY').addEventListener('change', handleAlignmentChange);
      document.getElementById('flipX').addEventListener('change', handleAlignmentChange);
      document.getElementById('divideCoords').addEventListener('change', handleAlignmentChange);

      // Canvas interactions
      canvas.addEventListener('mousedown', handleMouseDown);
      canvas.addEventListener('mousemove', handleMouseMove);
      canvas.addEventListener('mouseup', handleMouseUp);
      canvas.addEventListener('mouseleave', handleMouseUp);
      canvas.addEventListener('wheel', handleWheel);
      canvas.addEventListener('click', handleCanvasClick);

      // Keyboard shortcuts
      document.addEventListener('keydown', handleKeyDown);
    }

    // Load track image
    function loadTrack(code) {
      if (!code) {
        state.trackCode = null;
        state.trackImage = null;
        state.trackConfig = null;
        render();
        return;
      }

      state.trackCode = code;
      state.trackConfig = TRACK_CONFIGS[code];

      const img = new Image();
      img.onload = () => {
        state.trackImage = img;
        centerView();
        render();
      };
      img.onerror = () => {
        console.warn(`Could not load track image for ${code}`);
        state.trackImage = null;
        render();
      };
      img.src = `../public/tracks/track_${code}.png`;
    }

    // Center view on track
    function centerView() {
      if (!state.trackImage) return;

      const padding = 50;
      const scaleX = (canvas.width - padding * 2) / state.trackImage.width;
      const scaleY = (canvas.height - padding * 2) / state.trackImage.height;
      state.camera.zoom = Math.min(scaleX, scaleY, 1);
      state.camera.x = (canvas.width - state.trackImage.width * state.camera.zoom) / 2;
      state.camera.y = (canvas.height - state.trackImage.height * state.camera.zoom) / 2;
    }

    // Handle file input
    function handleFileInput(e) {
      const files = e.target.files;
      if (!files.length) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            addLayersFromData(data, file.name);
          } catch (err) {
            alert(`Error loading ${file.name}: ${err.message}`);
          }
        };
        reader.readAsText(file);
      });

      e.target.value = '';
    }

    // Extract point with all available data
    function extractPoint(p) {
      return {
        x: p.x,
        y: p.y,
        speed: p.speed || null,
        heading: p.heading || null
      };
    }

    // Add layers from parsed data
    function addLayersFromData(data, filename) {
      let layersToAdd = [];

      if (Array.isArray(data)) {
        // Direct array of points
        layersToAdd.push({
          name: filename.replace('.json', ''),
          path: data.map(extractPoint)
        });
      } else if (data.trips && Array.isArray(data.trips)) {
        // Multitrip format
        if (data.track && !state.trackCode) {
          document.getElementById('trackSelect').value = data.track;
          loadTrack(data.track);
        }
        data.trips.forEach((trip, i) => {
          if (trip.points && Array.isArray(trip.points)) {
            layersToAdd.push({
              name: trip.name || `Trip ${i + 1}`,
              path: trip.points.map(extractPoint)
            });
          }
        });
      } else if (data.points && Array.isArray(data.points)) {
        // Single trip
        layersToAdd.push({
          name: data.name || filename.replace('.json', ''),
          path: data.points.map(extractPoint)
        });
      } else if (data.path && Array.isArray(data.path)) {
        layersToAdd.push({
          name: filename.replace('.json', ''),
          path: data.path.map(extractPoint)
        });
      } else {
        throw new Error('Unknown JSON format');
      }

      layersToAdd.forEach(layerData => {
        state.layers.push({
          id: Date.now() + Math.random(),
          name: layerData.name,
          path: layerData.path,
          annotations: [],
          visible: true,
          color: LAYER_COLORS[state.layers.length % LAYER_COLORS.length],
          transform: { x: 0, y: 0, scale: 1, rotation: 0, flipY: true, flipX: false, divideCoords: false }
        });
      });

      state.activeLayerIndex = state.layers.length - 1;
      updateUI();
      render();
    }

    // Select turn type
    function selectTurnType(type) {
      state.selectedType = type;
      document.querySelectorAll('.turn-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.type === type);
      });
    }

    // Handle alignment changes
    function handleAlignmentChange() {
      const layer = state.layers[state.activeLayerIndex];
      if (!layer) return;

      layer.transform.x = parseFloat(document.getElementById('offsetX').value) || 0;
      layer.transform.y = parseFloat(document.getElementById('offsetY').value) || 0;
      layer.transform.scale = parseFloat(document.getElementById('scale').value) || 1;
      layer.transform.rotation = parseFloat(document.getElementById('rotation').value) || 0;
      layer.transform.flipY = document.getElementById('flipY').checked;
      layer.transform.flipX = document.getElementById('flipX').checked;
      layer.transform.divideCoords = document.getElementById('divideCoords').checked;

      render();
    }

    // Reset alignment
    function resetAlignment() {
      const layer = state.layers[state.activeLayerIndex];
      if (!layer) return;

      layer.transform = { x: 0, y: 0, scale: 1, rotation: 0, flipY: true, flipX: false, divideCoords: false };
      updateAlignmentUI();
      render();
    }

    // Auto-fit layer to track bounds
    window.autoFitLayer = () => {
      const layer = state.layers[state.activeLayerIndex];
      if (!layer || layer.path.length === 0) {
        alert('No layer selected or layer is empty');
        return;
      }

      // Get path bounds
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      layer.path.forEach(p => {
        let x = p.x, y = p.y;
        // Apply divideCoords if currently enabled
        if (layer.transform.divideCoords) {
          x /= 65536;
          y /= 65536;
        }
        minX = Math.min(minX, x);
        maxX = Math.max(maxX, x);
        minY = Math.min(minY, y);
        maxY = Math.max(maxY, y);
      });

      const pathWidth = maxX - minX;
      const pathHeight = maxY - minY;
      const pathCenterX = (minX + maxX) / 2;
      const pathCenterY = (minY + maxY) / 2;

      if (state.trackConfig) {
        // Fit to track bounds
        const b = state.trackConfig.bounds;
        const trackWidth = b.maxX - b.minX;
        const trackHeight = b.maxY - b.minY;
        const trackCenterX = (b.minX + b.maxX) / 2;
        const trackCenterY = (b.minY + b.maxY) / 2;

        // Calculate scale to fit path within track
        const scaleX = trackWidth / pathWidth;
        const scaleY = trackHeight / pathHeight;
        const newScale = Math.min(scaleX, scaleY) * 0.8; // 80% to leave margin

        // Calculate offset to center path
        layer.transform.scale = Math.min(5, Math.max(0.001, newScale));
        layer.transform.x = trackCenterX - pathCenterX * layer.transform.scale;
        layer.transform.y = trackCenterY - pathCenterY * layer.transform.scale;
      } else {
        // No track, just center on canvas
        layer.transform.scale = 1;
        layer.transform.x = -pathCenterX;
        layer.transform.y = -pathCenterY;
      }

      updateAlignmentUI();
      render();
    };

    // Update alignment UI
    function updateAlignmentUI() {
      const layer = state.layers[state.activeLayerIndex];
      const t = layer ? layer.transform : { x: 0, y: 0, scale: 1, rotation: 0, flipY: true, flipX: false, divideCoords: false };

      // Update range sliders
      document.getElementById('offsetX').value = t.x;
      document.getElementById('offsetY').value = t.y;
      document.getElementById('scale').value = t.scale;
      document.getElementById('rotation').value = t.rotation;

      // Update number inputs
      document.getElementById('offsetXNum').value = Math.round(t.x);
      document.getElementById('offsetYNum').value = Math.round(t.y);
      document.getElementById('scaleNum').value = t.scale.toFixed(3);
      document.getElementById('rotationNum').value = t.rotation;

      // Update checkboxes
      document.getElementById('flipY').checked = t.flipY;
      document.getElementById('flipX').checked = t.flipX || false;
      document.getElementById('divideCoords').checked = t.divideCoords || false;
    }

    // Mouse handlers
    let dragStarted = false;

    function handleMouseDown(e) {
      state.isDragging = true;
      dragStarted = false;
      state.lastMouse = { x: e.clientX, y: e.clientY };
    }

    function handleMouseMove(e) {
      if (!state.isDragging) return;

      const dx = e.clientX - state.lastMouse.x;
      const dy = e.clientY - state.lastMouse.y;

      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        dragStarted = true;
      }

      state.camera.x += dx;
      state.camera.y += dy;
      state.lastMouse = { x: e.clientX, y: e.clientY };
      render();
    }

    function handleMouseUp() {
      state.isDragging = false;
    }

    function handleWheel(e) {
      e.preventDefault();

      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newZoom = Math.max(0.1, Math.min(10, state.camera.zoom * zoomFactor));

      // Zoom towards mouse position
      state.camera.x = mouseX - (mouseX - state.camera.x) * (newZoom / state.camera.zoom);
      state.camera.y = mouseY - (mouseY - state.camera.y) * (newZoom / state.camera.zoom);
      state.camera.zoom = newZoom;

      render();
    }

    function handleCanvasClick(e) {
      if (dragStarted) return;

      const layer = state.layers[state.activeLayerIndex];
      if (!layer || !layer.visible || !state.selectedType) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Find nearest point on path
      let nearestIdx = -1;
      let minDist = Infinity;

      layer.path.forEach((p, i) => {
        const screenPos = worldToScreen(p, layer.transform);
        const dist = Math.hypot(screenPos.x - clickX, screenPos.y - clickY);
        if (dist < minDist) {
          minDist = dist;
          nearestIdx = i;
        }
      });

      // Only add if close enough (within 30px)
      if (nearestIdx >= 0 && minDist < 30) {
        layer.annotations.push({
          type: state.selectedType,
          index: nearestIdx,
          point: layer.path[nearestIdx]
        });
        layer.annotations.sort((a, b) => a.index - b.index);
        updateUI();
        render();
      }
    }

    // Keyboard shortcuts
    function handleKeyDown(e) {
      const keyMap = {
        'q': 'sharp_left', 'w': 'left', 'e': 'slight_left',
        'a': 'sharp_right', 's': 'right', 'd': 'slight_right'
      };

      if (keyMap[e.key.toLowerCase()]) {
        selectTurnType(keyMap[e.key.toLowerCase()]);
      }
    }

    // Convert world coordinates to screen coordinates
    function worldToScreen(point, transform) {
      let x = point.x;
      let y = point.y;

      // Divide by 65536 if raw LFS coordinates
      if (transform.divideCoords) {
        x /= 65536;
        y /= 65536;
      }

      // Apply flips
      if (transform.flipX) x = -x;
      if (transform.flipY) y = -y;

      // Apply scale
      x *= transform.scale;
      y *= transform.scale;

      // Apply rotation
      if (transform.rotation !== 0) {
        const rad = transform.rotation * Math.PI / 180;
        const cos = Math.cos(rad), sin = Math.sin(rad);
        const nx = x * cos - y * sin;
        const ny = x * sin + y * cos;
        x = nx; y = ny;
      }

      // Apply offset
      x += transform.x;
      y += transform.y;

      if (!state.trackConfig || !state.trackImage) {
        // No track loaded, use raw coordinates centered on canvas
        return {
          x: canvas.width / 2 + x * state.camera.zoom + (state.camera.x - canvas.width / 2),
          y: canvas.height / 2 + y * state.camera.zoom + (state.camera.y - canvas.height / 2)
        };
      }

      // Track loaded, use proper coordinate transformation
      const b = state.trackConfig.bounds;
      const imgW = state.trackImage.width;
      const imgH = state.trackImage.height;

      // Convert to image coordinates
      const pctX = (x - b.minX) / (b.maxX - b.minX);
      const pctY = (b.maxY - y) / (b.maxY - b.minY);

      const imgX = pctX * imgW;
      const imgY = pctY * imgH;

      // Apply camera transform
      return {
        x: state.camera.x + imgX * state.camera.zoom,
        y: state.camera.y + imgY * state.camera.zoom
      };
    }

    // Render
    function render() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 1;
      const gridSize = 50 * state.camera.zoom;
      const offsetX = state.camera.x % gridSize;
      const offsetY = state.camera.y % gridSize;

      ctx.beginPath();
      for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
      }
      for (let y = offsetY; y < canvas.height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
      }
      ctx.stroke();

      // Draw track image
      if (state.trackImage) {
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.drawImage(
          state.trackImage,
          state.camera.x,
          state.camera.y,
          state.trackImage.width * state.camera.zoom,
          state.trackImage.height * state.camera.zoom
        );
        ctx.restore();
      }

      // Draw layers
      state.layers.forEach((layer, index) => {
        if (!layer.visible || layer.path.length === 0) return;

        const isActive = index === state.activeLayerIndex;
        const alpha = isActive ? 1 : 0.4;

        // Draw path
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = layer.color;
        ctx.lineWidth = (isActive ? 3 : 2);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        layer.path.forEach((p, i) => {
          const sp = worldToScreen(p, layer.transform);
          if (i === 0) ctx.moveTo(sp.x, sp.y);
          else ctx.lineTo(sp.x, sp.y);
        });
        ctx.stroke();

        // Draw annotations
        layer.annotations.forEach(ann => {
          const sp = worldToScreen(ann.point, layer.transform);

          // Circle
          ctx.fillStyle = '#ffcc00';
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, 8, 0, Math.PI * 2);
          ctx.fill();

          // Icon
          ctx.fillStyle = '#000';
          ctx.font = '12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(getIcon(ann.type), sp.x, sp.y);
        });

        ctx.globalAlpha = 1;
      });

      // Update canvas info
      const info = [];
      if (state.trackCode) info.push(`Track: ${state.trackCode}`);
      info.push(`Zoom: ${(state.camera.zoom * 100).toFixed(0)}%`);
      document.getElementById('canvasInfo').textContent = info.join(' | ');
    }

    function getIcon(type) {
      const icons = {
        'slight_left': '↖', 'left': '←', 'sharp_left': '↩',
        'slight_right': '↗', 'right': '→', 'sharp_right': '↪'
      };
      return icons[type] || '•';
    }

    // Update UI
    function updateUI() {
      updateLayerList();
      updateAlignmentUI();
      updateAnnotationsList();
      updateStats();
    }

    function updateLayerList() {
      const container = document.getElementById('layerList');
      document.getElementById('layerCount').textContent = state.layers.length;

      if (state.layers.length === 0) {
        container.innerHTML = '<div class="empty-state">Load trip recordings<br>using "+ Add Trip"</div>';
        return;
      }

      container.innerHTML = state.layers.map((layer, index) => `
        <div class="layer-item ${index === state.activeLayerIndex ? 'active' : ''} ${!layer.visible ? 'hidden' : ''}"
             onclick="selectLayer(${index})">
          <div class="layer-top">
            <div class="layer-name">
              <span class="layer-color" style="background: ${layer.color}"></span>
              <span title="${layer.name}">${layer.name}</span>
            </div>
            <div class="layer-actions">
              <button class="layer-btn" onclick="toggleLayer(${index}); event.stopPropagation();">
                ${layer.visible ? '👁' : '○'}
              </button>
              <button class="layer-btn danger" onclick="deleteLayer(${index}); event.stopPropagation();">×</button>
            </div>
          </div>
          <div class="layer-stats">
            <span>${layer.path.length} pts</span>
            <span>${layer.annotations.length} labels</span>
          </div>
        </div>
      `).join('');
    }

    function updateAnnotationsList() {
      const container = document.getElementById('annList');
      const layer = state.layers[state.activeLayerIndex];

      if (!layer || layer.annotations.length === 0) {
        container.innerHTML = '<div class="empty-state" style="padding: 20px;">No annotations yet</div>';
        document.getElementById('annCount').textContent = '0';
        return;
      }

      document.getElementById('annCount').textContent = layer.annotations.length;
      container.innerHTML = layer.annotations.map((ann, i) => `
        <div class="annotation-item">
          <span>${getIcon(ann.type)} ${ann.type.replace('_', ' ')} @ ${ann.index}</span>
          <button onclick="deleteAnnotation(${i})">×</button>
        </div>
      `).join('');
    }

    function updateStats() {
      const totalPoints = state.layers.reduce((sum, l) => sum + l.path.length, 0);
      const totalLabels = state.layers.reduce((sum, l) => sum + l.annotations.length, 0);

      document.getElementById('statPoints').textContent = totalPoints;
      document.getElementById('statLabels').textContent = totalLabels;
      document.getElementById('statLayers').textContent = state.layers.length;
    }

    // Layer management
    window.selectLayer = (index) => {
      state.activeLayerIndex = index;
      updateUI();
      render();
    };

    window.toggleLayer = (index) => {
      state.layers[index].visible = !state.layers[index].visible;
      updateLayerList();
      render();
    };

    window.deleteLayer = (index) => {
      if (!confirm(`Delete "${state.layers[index].name}"?`)) return;
      state.layers.splice(index, 1);
      if (state.activeLayerIndex >= state.layers.length) {
        state.activeLayerIndex = Math.max(0, state.layers.length - 1);
      }
      if (state.layers.length === 0) state.activeLayerIndex = null;
      updateUI();
      render();
    };

    window.deleteAnnotation = (index) => {
      const layer = state.layers[state.activeLayerIndex];
      if (!layer) return;
      layer.annotations.splice(index, 1);
      updateUI();
      render();
    };

    // Calculate angle between two points (in degrees)
    function calcAngle(p1, p2) {
      return Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
    }

    // Calculate angle difference (normalized to -180 to 180)
    function angleDiff(a1, a2) {
      let diff = a2 - a1;
      while (diff > 180) diff -= 360;
      while (diff < -180) diff += 360;
      return diff;
    }

    // Export with computed features for ML training
    window.exportDataset = () => {
      const totalLabels = state.layers.reduce((sum, l) => sum + l.annotations.length, 0);
      if (totalLabels === 0) {
        alert('No annotations to export');
        return;
      }

      const WINDOW_SIZE = 5; // Points before/after to analyze
      const dataset = [];

      state.layers.forEach(layer => {
        const path = layer.path;
        if (path.length < 3) return;

        layer.annotations.forEach(ann => {
          const idx = ann.index;
          if (idx < 1 || idx >= path.length - 1) return;

          // Calculate angles for segments around the annotation point
          const beforeAngles = [];
          const afterAngles = [];

          // Angles BEFORE the turn point
          for (let i = Math.max(0, idx - WINDOW_SIZE); i < idx; i++) {
            if (i + 1 < path.length) {
              beforeAngles.push(calcAngle(path[i], path[i + 1]));
            }
          }

          // Angles AFTER the turn point
          for (let i = idx; i < Math.min(path.length - 1, idx + WINDOW_SIZE); i++) {
            afterAngles.push(calcAngle(path[i], path[i + 1]));
          }

          // Calculate the turn angle (angle change at this point)
          let turnAngle = 0;
          if (idx > 0 && idx < path.length - 1) {
            const angleBefore = calcAngle(path[idx - 1], path[idx]);
            const angleAfter = calcAngle(path[idx], path[idx + 1]);
            turnAngle = angleDiff(angleBefore, angleAfter);
          }

          // Get speed if available in original data
          const speed = path[idx].speed || 20;

          dataset.push({
            layer: layer.name,
            turnType: ann.type,
            angleDiff: turnAngle,
            speed: speed,
            point: { x: path[idx].x, y: path[idx].y },
            index: idx,
            features: {
              beforeAngles: beforeAngles,
              afterAngles: afterAngles
            }
          });
        });
      });

      if (dataset.length === 0) {
        alert('No valid annotations to export (annotations must not be at path endpoints)');
        return;
      }

      const data = {
        metadata: {
          track: state.trackCode,
          timestamp: Date.now(),
          windowSize: WINDOW_SIZE,
          layers: state.layers.map(l => ({
            name: l.name,
            points: l.path.length,
            annotations: l.annotations.length
          }))
        },
        dataset
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `turn_dataset_${state.trackCode || 'unknown'}_${Date.now()}.json`;
      a.click();

      console.log(`Exported ${dataset.length} annotations with computed features`);
    };

    window.clearAllAnnotations = () => {
      if (!confirm('Clear all annotations from all layers?')) return;
      state.layers.forEach(l => l.annotations = []);
      updateUI();
      render();
    };

    window.showHelp = () => {
      alert(
        'Turn Annotator - Quick Guide\n\n' +
        '1. Select a track from the dropdown\n' +
        '2. Load trip recordings with "+ Add Trip"\n' +
        '3. Select a turn type (Q/W/E = Left, A/S/D = Right)\n' +
        '4. Click on the path to add annotations\n' +
        '5. Use alignment controls to adjust if needed\n' +
        '6. Export dataset when finished\n\n' +
        'Controls:\n' +
        '• Scroll to zoom\n' +
        '• Drag to pan\n' +
        '• Click layer to select'
      );
    };

    // Initialize
    init();
  </script>
</body>
</html>
